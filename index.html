<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>毕游拼团 · 毕业旅行拼团规划</title>
<style>
:root{--y:#FFC300;--yd:#F5A300;--bg:#F6F6F4;--card:#fff;--t:#222;--m:#888;--b:#eee;--g:#18A058;--r:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);font-size:14px;line-height:1.6}
header{background:var(--y);padding:16px 16px 0;position:sticky;top:0;z-index:9}
.top{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:800}.logo small{font-size:12px;font-weight:400;margin-left:8px;opacity:.75}
.code{background:#fff;border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer}
nav{max-width:960px;margin:12px auto 0;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;font-size:15px;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;color:#5a4500}
nav button.on{background:var(--bg);font-weight:700;color:#000}
main{max-width:960px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{font-size:17px;margin-bottom:10px}h3{font-size:15px;margin-bottom:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:#FFF8DC;border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}
.muted{color:var(--m);font-size:12px}
.tag{display:inline-block;background:#f2f2f2;border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}
.tag.y{background:#FFF1B8}.tag.g{background:#E3F7EA;color:var(--g)}.tag.r{background:#FDECEC;color:var(--r)}
.btn{background:var(--y);border:0;border-radius:20px;padding:8px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:var(--yd)}.btn.s{padding:4px 12px;font-size:12px}.btn.o{background:#fff;border:1px solid #ddd}
input,select{border:1px solid #ddd;border-radius:8px;padding:7px 10px;font-size:14px;width:100%;background:#fff}
label{font-size:12px;color:var(--m);display:block;margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.chips label{display:inline-flex;align-items:center;gap:4px;color:var(--t);font-size:13px;margin:3px 10px 3px 0}
.chips input{width:auto}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left;font-size:13px}th{color:var(--m);font-weight:400}
.flow{display:flex;gap:8px;flex-wrap:wrap}.flow div{flex:1;min-width:130px;background:#fafafa;border-radius:10px;padding:10px;border-left:3px solid var(--y)}
.group{border:1px solid var(--b);border-radius:12px;padding:12px}
.group .hd{display:flex;justify-content:space-between;align-items:center}
.av{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--y);align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:2px}
.day{border-left:2px solid var(--y);padding-left:14px;margin:0 0 14px 6px;position:relative}
.day:before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--y)}
.item{display:flex;justify-content:space-between;align-items:center;background:#fafafa;border-radius:8px;padding:8px 10px;margin:6px 0;gap:8px}
.item.ok{background:#E3F7EA}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
.tr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--b)}
.pos{color:var(--g);font-weight:600}.neg{color:var(--r);font-weight:600}
.hide{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">🎓 毕游拼团<small>毕业旅行 · 组队 / 行程 / 分账 一站搞定</small></div>
    <span class="code" onclick="copyCode()">邀请码 GT2026 📋</span>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DESTS=["云南大理","青岛","成都重庆","厦门","西安","三亚"];
const STYLES=["特种兵","躺平休闲","美食打卡","拍照出片"];
const DEMO={
 members:[
  {n:"小林",d:["云南大理","厦门"],b:3000,s:"拍照出片",from:"07-01",to:"07-10"},
  {n:"阿杰",d:["云南大理","成都重庆"],b:3500,s:"特种兵",from:"07-02",to:"07-12"},
  {n:"思思",d:["云南大理","三亚"],b:2800,s:"拍照出片",from:"07-01",to:"07-08"},
  {n:"大壮",d:["成都重庆","西安"],b:1800,s:"美食打卡",from:"07-05",to:"07-15"},
  {n:"糖糖",d:["成都重庆","青岛"],b:2000,s:"美食打卡",from:"07-04",to:"07-12"},
  {n:"老王",d:["西安","成都重庆"],b:1500,s:"特种兵",from:"07-06",to:"07-14"},
  {n:"小雨",d:["青岛","厦门"],b:1600,s:"躺平休闲",from:"07-08",to:"07-18"},
  {n:"豆豆",d:["青岛","云南大理"],b:1500,s:"躺平休闲",from:"07-09",to:"07-20"},
  {n:"阿凯",d:["青岛","西安"],b:1800,s:"美食打卡",from:"07-08",to:"07-16"},
  {n:"琪琪",d:["三亚","云南大理"],b:3200,s:"拍照出片",from:"07-03",to:"07-09"}
 ],
 plans:{
  "云南大理":[
   {day:1,t:"抵达大理，入住洱海边民宿",v:["小林","阿杰","思思"],ok:true},
   {day:1,t:"大理古城夜游 + 毕业合照",v:["小林","思思"],ok:false},
   {day:2,t:"环洱海骑行（租电动车）",v:["小林","阿杰","思思","琪琪"],ok:true},
   {day:2,t:"喜洲古镇 + 麦田旅拍",v:["思思","琪琪"],ok:false},
   {day:3,t:"苍山索道",v:["阿杰"],ok:false},
   {day:3,t:"返程",v:["小林","阿杰","思思","琪琪"],ok:true}
  ]
 },
 expenses:[
  {t:"洱海民宿 2晚",a:1200,p:"小林",w:["小林","阿杰","思思","琪琪"]},
  {t:"电动车租赁",a:240,p:"阿杰",w:["小林","阿杰","思思","琪琪"]},
  {t:"旅拍套餐",a:600,p:"思思",w:["思思","琪琪","小林"]},
  {t:"白族菜晚饭",a:360,p:"琪琪",w:["小林","阿杰","思思","琪琪"]}
 ],
 cur:"云南大理"
};
let S;
try{S=JSON.parse(localStorage.getItem("gt_state"))}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEMO));
function save(){try{localStorage.setItem("gt_state",JSON.stringify(S))}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function copyCode(){try{navigator.clipboard.writeText("GT2026")}catch(e){}toast("邀请码已复制，发到班级群即可邀请同学")}
const md=s=>{const[a,b]=s.split("-").map(Number);return a*31+b};

/* ---------- 智能组队算法 ---------- */
function grouping(){
  const MIN=3,ms=S.members;
  let assign={};ms.forEach(m=>assign[m.n]=0);
  for(let round=0;round<3;round++){
    const g={};ms.forEach(m=>{const d=m.d[assign[m.n]];if(d)(g[d]=g[d]||[]).push(m)});
    let moved=false;
    Object.entries(g).forEach(([d,arr])=>{if(arr.length<MIN)arr.forEach(m=>{if(assign[m.n]<m.d.length-1){assign[m.n]++;moved=true}})});
    if(!moved)break;
  }
  const g={};ms.forEach(m=>{const d=m.d[assign[m.n]]||m.d[0];(g[d]=g[d]||[]).push(m)});
  return Object.entries(g).map(([d,arr])=>{
    const bs=arr.map(m=>m.b),from=Math.max(...arr.map(m=>md(m.from))),to=Math.min(...arr.map(m=>md(m.to)));
    const fmt=x=>`${String(Math.floor(x/31)).padStart(2,"0")}-${String(x%31).padStart(2,"0")}`;
    const days=to-from+1;
    const sat=arr.filter(m=>m.d[0]===d).length;
    const st={};arr.forEach(m=>st[m.s]=(st[m.s]||0)+1);
    return{d,arr,bmin:Math.min(...bs),bmax:Math.max(...bs),avg:Math.round(bs.reduce((a,b)=>a+b,0)/bs.length),
      win:days>0?`${fmt(from)} ~ ${fmt(to)}（${days}天）`:"无共同时间",ok:days>=3&&arr.length>=MIN,sat:Math.round(sat/arr.length*100),
      style:Object.entries(st).sort((a,b)=>b[1]-a[1])[0][0]};
  }).sort((a,b)=>b.arr.length-a.arr.length);
}

/* ---------- 分账：最少转账 ---------- */
function settle(){
  const bal={};S.expenses.forEach(e=>{bal[e.p]=(bal[e.p]||0)+e.a;const per=e.a/e.w.length;e.w.forEach(n=>bal[n]=(bal[n]||0)-per)});
  const cr=[],db=[];Object.entries(bal).forEach(([n,v])=>{v=Math.round(v*100)/100;if(v>0.01)cr.push([n,v]);else if(v<-0.01)db.push([n,-v])});
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const tx=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);tx.push([db[i][0],cr[j][0],x]);db[i][1]-=x;cr[j][1]-=x;if(db[i][1]<0.01)i++;if(cr[j][1]<0.01)j++}
  return{bal,tx};
}

/* ---------- 页面 ---------- */
const TABS=[["home","🏠 总览"],["intent","📝 意向收集"],["team","🤝 智能组队"],["plan","🗓 统一行程"],["money","💰 费用分摊"]];
let tab="home";
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.getElementById("nav").innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("");
  document.getElementById("app").innerHTML=({home,intent,team,plan,money})[tab]();
}

function home(){
  const gs=grouping(),tot=S.expenses.reduce((a,e)=>a+e.a,0);
  return `
  <div class="card"><h2>👋 2026 毕业旅行 · 计算机学院 3 班</h2>
   <p class="muted">发起人：小林 · 邀请码 GT2026 · 同学填完意向后，系统会自动分团、排行程、算账</p>
   <div class="grid" style="margin-top:12px">
    <div class="stat"><b>${S.members.length}</b>位同学已填意向</div>
    <div class="stat"><b>${gs.length}</b>个旅行小团已生成</div>
    <div class="stat"><b>${(S.plans[S.cur]||[]).filter(i=>i.ok).length}</b>项行程已确认（${S.cur}团）</div>
    <div class="stat"><b>¥${tot}</b>已记账（${S.cur}团）</div>
   </div></div>
  <div class="card"><h2>🧭 使用流程</h2><div class="flow">
   <div><b>① 发起 & 邀请</b><br><span class="muted">生成邀请码，发到班群，扫码即加入</span></div>
   <div><b>② 填写意向</b><br><span class="muted">想去哪、什么时候有空、预算多少、玩法偏好</span></div>
   <div><b>③ 智能组队</b><br><span class="muted">按目的地+预算+时间自动拆成小团</span></div>
   <div><b>④ 投票定行程</b><br><span class="muted">过半数自动确认，全团看同一份行程</span></div>
   <div><b>⑤ 记账分摊</b><br><span class="muted">随手记，结束一键算出最少转账</span></div>
  </div></div>
  <div class="card"><h2>💡 我们解决的问题</h2><table>
   <tr><th>痛点</th><th>以前</th><th>现在</th></tr>
   <tr><td>人多</td><td>群里几百条消息，接龙统计易遗漏</td><td>结构化意向表，一屏看清所有人</td></tr>
   <tr><td>目的地分散</td><td>争论不休，少数人被迫妥协</td><td>按首选/次选自动分团，满足率可视化</td></tr>
   <tr><td>预算不一</td><td>穷游党和享受党互相迁就</td><td>同团预算相近，展示人均预算区间</td></tr>
   <tr><td>组织困难</td><td>行程靠一个人拍板，账算到怀疑人生</td><td>投票定行程 + 自动分账最少转账</td></tr>
  </table></div>
  <div style="text-align:center"><button class="btn" onclick="go('intent')">开始体验 →</button>
  <button class="btn o" onclick="if(confirm('恢复演示数据？')){S=JSON.parse(JSON.stringify(DEMO));save();render()}">重置演示数据</button></div>`;
}

function intent(){
  return `
  <div class="card"><h2>📝 填写我的旅行意向</h2>
   <div class="row"><div><label>昵称</label><input id="fn" placeholder="如：小明"></div>
    <div><label>人均预算（元，不含往返大交通可备注）</label><input id="fb" type="number" value="2000"></div>
    <div><label>玩法偏好</label><select id="fs">${STYLES.map(s=>`<option>${s}</option>`).join("")}</select></div></div>
   <div class="row"><div><label>最早出发（月-日）</label><input id="ff" value="07-01"></div><div><label>最晚返回（月-日）</label><input id="ft" value="07-10"></div></div>
   <label>想去的目的地（按勾选顺序作为第1、2…志愿）</label>
   <div class="chips" id="fd">${DESTS.map(d=>`<label><input type="checkbox" value="${d}" onchange="ord(this)">${d}</label>`).join("")}</div>
   <p class="muted" id="ordtxt">志愿顺序：未选择</p>
   <div style="margin-top:10px"><button class="btn" onclick="addM()">提交意向</button></div></div>
  <div class="card"><h2>👥 已填写（${S.members.length}人）</h2><div style="overflow-x:auto"><table>
   <tr><th>同学</th><th>志愿</th><th>预算</th><th>可出行</th><th>偏好</th><th></th></tr>
   ${S.members.map((m,i)=>`<tr><td><span class="av">${m.n[0]}</span>${m.n}</td><td>${m.d.map((d,k)=>`<span class="tag ${k?"":"y"}">${k+1}.${d}</span>`).join("")}</td><td>¥${m.b}</td><td>${m.from}~${m.to}</td><td>${m.s}</td><td><button class="btn o s" onclick="S.members.splice(${i},1);save();render()">删除</button></td></tr>`).join("")}
  </table></div></div>`;
}
let order=[];
function ord(el){if(el.checked)order.push(el.value);else order=order.filter(x=>x!==el.value);document.getElementById("ordtxt").textContent="志愿顺序："+(order.length?order.map((d,i)=>`${i+1}.${d}`).join(" → "):"未选择")}
function addM(){
  const n=fn.value.trim();if(!n)return toast("请填写昵称");if(!order.length)return toast("至少选一个目的地");
  if(S.members.some(m=>m.n===n))return toast("昵称已存在");
  S.members.push({n,d:[...order],b:+fb.value||0,s:fs.value,from:ff.value,to:ft.value});order=[];save();render();toast("已提交！去「智能组队」看看你被分到哪个团");
}

function team(){
  const gs=grouping();
  return `
  <div class="card"><h2>🤝 智能组队结果</h2>
   <p class="muted">规则：优先按第一志愿成团；人数不足 3 人的团自动拆散，成员按下一志愿重新分配；同时计算团内共同可出行时间与预算区间。</p></div>
  <div class="grid">${gs.map(g=>`
   <div class="group card"><div class="hd"><h3>📍 ${g.d}团</h3>${g.ok?'<span class="tag g">可成行</span>':'<span class="tag r">待协调</span>'}</div>
    <div>${g.arr.map(m=>`<span class="av" title="${m.n}">${m.n[0]}</span>`).join("")} <span class="muted">${g.arr.length}人</span></div>
    <div style="margin-top:6px">💰 预算 ¥${g.bmin}~${g.bmax}，人均 ¥${g.avg}</div>
    <div>📅 共同时间：${g.win}</div>
    <div>🎯 主流玩法：${g.style}</div>
    <div style="margin-top:6px" class="muted">第一志愿满足率 ${g.sat}%</div><div class="bar"><i style="width:${g.sat}%"></i></div>
    <div style="margin-top:6px" class="muted">推荐档位：${g.avg>=2800?"舒适游（精品民宿+包车）":g.avg>=1800?"品质游（经济酒店+公共交通）":"穷游（青旅/高铁硬座+City Walk）"}</div>
    <div style="margin-top:10px"><button class="btn s" onclick="S.cur='${g.d}';save();go('plan')">进入该团规划 →</button></div>
   </div>`).join("")}</div>`;
}

function plan(){
  const gs=grouping(),g=gs.find(x=>x.d===S.cur)||gs[0];if(!g)return`<div class="card">暂无成团</div>`;
  S.cur=g.d;const items=(S.plans[g.d]=S.plans[g.d]||[]);const half=Math.ceil(g.arr.length/2);
  const days=[...new Set(items.map(i=>i.day))].sort((a,b)=>a-b);
  return `
  <div class="card"><div class="row" style="align-items:end"><div><label>当前小团</label><select onchange="S.cur=this.value;save();render()">${gs.map(x=>`<option ${x.d===g.d?"selected":""}>${x.d}</option>`).join("")}</select></div>
   <div class="muted">成员：${g.arr.map(m=>m.n).join("、")}<br>规则：赞成票 ≥ ${half} 票（过半）自动确认 ✅</div></div></div>
  <div class="card"><h2>🗓 ${g.d} · 行程时间轴</h2>
   ${days.length?days.map(d=>`<div class="day"><h3>Day ${d}</h3>${items.map((it,i)=>it.day!==d?"":`
     <div class="item ${it.v.length>=half?"ok":""}"><div>${it.v.length>=half?"✅":"🗳"} ${it.t}<div class="muted">${it.v.length} 票：${it.v.join("、")||"暂无"}</div></div>
     <select style="width:auto" onchange="vote(${i},this.value);this.value=''"><option value="">我是…投票</option>${g.arr.map(m=>`<option>${m.n}</option>`).join("")}</select></div>`).join("")}</div>`).join(""):'<p class="muted">还没有行程提议，来添加第一个吧</p>'}
  </div>
  <div class="card"><h2>➕ 提议一个安排</h2><div class="row"><div style="flex:.3"><label>第几天</label><input id="pd" type="number" value="1" min="1"></div><div><label>安排内容</label><input id="pt" placeholder="如：洱海日出 + 早餐"></div></div>
   <div style="margin-top:10px"><button class="btn" onclick="addP()">发起投票</button></div></div>`;
}
function vote(i,n){if(!n)return;const it=S.plans[S.cur][i];const k=it.v.indexOf(n);k>=0?it.v.splice(k,1):it.v.push(n);save();render();toast(k>=0?n+" 取消了投票":n+" 投了赞成票")}
function addP(){const t=pt.value.trim();if(!t)return toast("请填写内容");S.plans[S.cur].push({day:+pd.value||1,t,v:[]});save();render();toast("已发起，等待团员投票")}

function money(){
  const gs=grouping(),g=gs.find(x=>x.d===S.cur)||gs[0];const names=g?g.arr.map(m=>m.n):[];
  const {bal,tx}=settle(),tot=S.expenses.reduce((a,e)=>a+e.a,0);
  return `
  <div class="card"><h2>💰 ${S.cur}团 · 共同账本</h2>
   <div class="grid"><div class="stat"><b>¥${tot}</b>总支出</div><div class="stat"><b>¥${names.length?Math.round(tot/names.length):0}</b>人均</div><div class="stat"><b>${tx.length}</b>笔转账即可结清</div></div></div>
  <div class="card"><h2>✍️ 记一笔</h2><div class="row"><div><label>项目</label><input id="et" placeholder="如：包车一天"></div><div><label>金额</label><input id="ea" type="number"></div>
   <div><label>谁付的</label><select id="ep">${names.map(n=>`<option>${n}</option>`).join("")}</select></div></div>
   <label>谁参与（平摊）</label><div class="chips" id="ew">${names.map(n=>`<label><input type="checkbox" value="${n}" checked>${n}</label>`).join("")}</div>
   <div style="margin-top:10px"><button class="btn" onclick="addE()">记账</button></div></div>
  <div class="card"><h2>📒 明细</h2><table><tr><th>项目</th><th>金额</th><th>付款</th><th>分摊</th><th></th></tr>
   ${S.expenses.map((e,i)=>`<tr><td>${e.t}</td><td>¥${e.a}</td><td>${e.p}</td><td>${e.w.length}人 · ¥${(e.a/e.w.length).toFixed(2)}/人</td><td><button class="btn o s" onclick="S.expenses.splice(${i},1);save();render()">删</button></td></tr>`).join("")}</table></div>
  <div class="grid">
   <div class="card"><h2>⚖️ 每人收支</h2>${Object.entries(bal).map(([n,v])=>`<div class="tr"><span class="av">${n[0]}</span>${n}<span style="margin-left:auto" class="${v>=0?"pos":"neg"}">${v>=0?"应收":"应付"} ¥${Math.abs(v).toFixed(2)}</span></div>`).join("")}</div>
   <div class="card"><h2>🔁 最少转账方案</h2>${tx.length?tx.map(([a,b,x])=>`<div class="tr"><span class="av">${a[0]}</span>${a} → <span class="av">${b[0]}</span>${b}<b style="margin-left:auto">¥${x.toFixed(2)}</b></div>`).join(""):'<p class="muted">已结清 🎉</p>'}
    <p class="muted" style="margin-top:8px">贪心匹配最大债务人与最大债权人，转账笔数 ≤ 人数-1</p>
    <button class="btn s" style="margin-top:8px" onclick="toast('结算单已生成，可分享到群聊')">一键分享结算单</button></div>
  </div>`;
}
function addE(){const t=et.value.trim(),a=+ea.value;const w=[...document.querySelectorAll("#ew input:checked")].map(x=>x.value);
  if(!t||!a)return toast("请填写项目和金额");if(!w.length)return toast("至少选择一位参与人");
  S.expenses.push({t,a,p:ep.value,w});save();render();toast("已记账")}

render();
</script>
</body>
</html>
