<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GradTrip 毕旅搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: 单列居中工作区（max 1120px），卡片按角色区分；签名元素 = 登机牌式组队卡 + 车票式行程时间轴 */
:root {
  --bg: #FFF7EE;          /* 奶油白 */
  --surface: #FFFFFF;
  --surface-2: #FFF1E3;
  --ink: #2A211C;
  --muted: #7B6A5F;
  --line: #F0DFCE;
  --sun: #F2672A;         /* 日落橙：主操作 */
  --sun-ink: #FFFFFF;
  --sun-soft: #FFE6D6;
  --sea: #2F7FE0;         /* 海盐蓝：信息 */
  --sea-soft: #E2EEFC;
  --mint: #1F9E6A;        /* 成功 / 已确认 */
  --mint-soft: #DDF4E9;
  --lemon: #FFD23F;
  --lemon-soft: #FFF4C9;
  --pink: #F2709A;
  --pink-soft: #FDE3EC;
  --danger: #D93F45;
  --danger-soft: #FCE4E4;
  --shadow: 0 1px 2px rgba(80, 40, 10, .06), 0 8px 24px rgba(80, 40, 10, .07);
  --f-display: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 18px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1512; --surface: #251D18; --surface-2: #2E241E; --ink: #F6ECE3; --muted: #B8A799; --line: #3D3029;
    --sun: #FF8048; --sun-ink: #1B1512; --sun-soft: #4A2A1C; --sea: #6AAEFF; --sea-soft: #1F3048;
    --mint: #4FD39C; --mint-soft: #173A2C; --lemon: #FFD84D; --lemon-soft: #3F361A; --pink: #FF8FB1; --pink-soft: #45222F;
    --danger: #FF6B6F; --danger-soft: #4A2224; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1512; --surface: #251D18; --surface-2: #2E241E; --ink: #F6ECE3; --muted: #B8A799; --line: #3D3029;
  --sun: #FF8048; --sun-ink: #1B1512; --sun-soft: #4A2A1C; --sea: #6AAEFF; --sea-soft: #1F3048;
  --mint: #4FD39C; --mint-soft: #173A2C; --lemon: #FFD84D; --lemon-soft: #3F361A; --pink: #FF8FB1; --pink-soft: #45222F;
  --danger: #FF6B6F; --danger-soft: #4A2224; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); letter-spacing: .5px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 3.6vw, 30px); }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--sea); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--f-mono); letter-spacing: .04em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--sun); text-transform: uppercase; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
.page { padding-block: 24px 120px; display: grid; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid-2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.spacer { flex: 1; }

/* ---------- 顶栏 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 10px; height: 58px; }
.logo { display: flex; align-items: baseline; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--f-display); font-size: 22px; color: var(--ink); white-space: nowrap; }
.logo b { color: var(--sun); font-weight: 400; }
.logo small { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.crumb { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; max-width: 32vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; color: var(--ink); max-width: 130px; }
@media (max-width: 560px) { .logo small, .who > span { display: none; } .crumb { max-width: 28vw; } }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform .12s, background .15s, border-color .15s; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--sun); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 16px -6px var(--sun); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); }
.btn.sea { background: var(--sea); border-color: var(--sea); color: var(--sun-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); border-color: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.lg { padding: 13px 26px; font-size: 16px; }
.btn.sm { padding: 5px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.pulse:not(:disabled) { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 6px 16px -6px var(--sun); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--sun) 18%, transparent); } }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 34px; height: 32px; padding: 0 8px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.icon-btn:hover { border-color: var(--sun); }
.icon-btn.on { background: var(--sun-soft); border-color: var(--sun); }
.hint { font-size: 13px; color: var(--muted); }
.hint.warn { color: var(--danger); }

/* ---------- 卡片 & 标签 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--surface-2); box-shadow: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; transition: all .12s; user-select: none; }
.chip:hover { border-color: var(--sun); }
.chip.on { background: var(--sun-soft); border-color: var(--sun); color: var(--ink); font-weight: 600; }
.chip.off { opacity: .4; cursor: not-allowed; }
.chip .rank { width: 20px; height: 20px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); font-size: 12px; display: inline-grid; place-items: center; font-weight: 700; }
.chip .x { opacity: .55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.sun { background: var(--sun-soft); color: var(--sun); }
.tag.sea { background: var(--sea-soft); color: var(--sea); }
.tag.mint { background: var(--mint-soft); color: var(--mint); }
.tag.pink { background: var(--pink-soft); color: var(--pink); }
.tag.lemon { background: var(--lemon-soft); color: var(--ink); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r-sm); background: var(--lemon-soft); border: 1px solid color-mix(in srgb, var(--lemon) 60%, transparent); }
.banner.sea { background: var(--sea-soft); border-color: color-mix(in srgb, var(--sea) 30%, transparent); }
.banner.mint { background: var(--mint-soft); border-color: color-mix(in srgb, var(--mint) 30%, transparent); }
.banner .grow { flex: 1; min-width: 180px; }

/* ---------- 头像 ---------- */
.ava { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); border: 2px solid var(--surface); font-size: 19px; flex: none; position: relative; }
.ava.lg { width: 56px; height: 56px; font-size: 30px; }
.ava.sm { width: 28px; height: 28px; font-size: 15px; }
.ava .ok { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--mint); color: #fff; font-size: 10px; display: grid; place-items: center; border: 2px solid var(--surface); }
.ava-stack { display: flex; }
.ava-stack .ava { margin-left: -8px; }
.ava-stack .ava:first-child { margin-left: 0; }

/* ---------- 表单 ---------- */
.field { display: grid; gap: 6px; }
.field > label, .label { font-weight: 600; font-size: 14px; }
.input, select.input, textarea.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; outline: none; transition: border-color .15s; }
.input:focus { border-color: var(--sun); }
.input.err { border-color: var(--danger); }
.err-text { color: var(--danger); font-size: 13px; }
.input-row { display: flex; gap: 8px; }
.input-row .input { flex: 1; min-width: 0; }
.form-grid { display: grid; gap: 18px; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }

/* 双滑块 */
.dual { position: relative; height: 36px; }
.dual .track { position: absolute; left: 0; right: 0; top: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.dual .fill { position: absolute; top: 16px; height: 6px; border-radius: 3px; background: var(--sun); }
.dual input[type=range] { position: absolute; left: 0; width: 100%; top: 6px; margin: 0; pointer-events: none; -webkit-appearance: none; appearance: none; background: none; height: 26px; }
.dual input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sun); cursor: grab; box-shadow: var(--shadow); }
.dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--sun); cursor: grab; }
.big-num { font-family: var(--f-display); font-size: 34px; color: var(--sun); }

/* ---------- Landing ---------- */
.hero { display: grid; gap: 32px; align-items: center; padding-block: 24px 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); padding-block: 48px 16px; } }
.hero h1 em { font-style: normal; color: var(--sun); }
.hero .sub { font-size: 17px; color: var(--muted); max-width: 30em; margin-top: 14px; }
.hero .ctas { margin-top: 24px; }
.code-box { margin-top: 14px; max-width: 380px; }
.code-box .input { font-family: var(--f-mono); letter-spacing: .2em; text-transform: uppercase; }
.steps3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.step-card { padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.step-card .n { font-family: var(--f-mono); color: var(--sun); font-size: 13px; }
.step-card .big { font-size: 28px; }

/* ---------- 登机牌 ---------- */
.pass { position: relative; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.pass-top { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; background: var(--sun); color: var(--sun-ink); font-size: 11px; }
.pass.sea .pass-top { background: var(--sea); }
.pass.mint .pass-top { background: var(--mint); }
.pass-main { padding: 16px 18px 14px; display: grid; gap: 12px; }
.route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.route .end small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .12em; font-family: var(--f-mono); }
.route .end b { font-family: var(--f-display); font-weight: 400; font-size: 26px; display: block; line-height: 1.1; }
.route .end .mono { font-size: 12px; color: var(--muted); }
.route .end.to { text-align: right; }
.route .path { height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); position: relative; }
.route .path::after { content: "✈"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); background: var(--surface); padding: 0 6px; color: var(--sun); font-size: 16px; }
.pass-fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .pass-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pf small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.pf b { font-size: 14px; font-variant-numeric: tabular-nums; }
.perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 14px; }
.perf::before, .perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { left: -26px; } .perf::after { right: -26px; }
.pass-body { padding: 14px 18px 18px; display: grid; gap: 12px; flex: 1; align-content: start; }
.pass-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pass-title h3 { font-size: 18px; }
.ring { --p: 80; --c: var(--sun); width: 62px; height: 62px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.ring > span { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.ring > span small { display: block; font-size: 9px; color: var(--muted); font-weight: 500; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.reasons li { display: flex; gap: 8px; }
.reasons li::before { content: "✓"; color: var(--mint); font-weight: 700; flex: none; }
.reasons.warn li::before { content: "!"; color: var(--sun); }
.reasons.warn li { color: var(--muted); }
.mchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
.mchip:hover { border-color: var(--sun); }
.mchip.me { border-color: var(--sea); background: var(--sea-soft); }
.stamp { position: absolute; left: 50%; top: 46px; transform: translateX(-50%) rotate(-12deg); background: var(--surface); border: 3px solid var(--mint); color: var(--mint); font-family: var(--f-display); font-size: 22px; padding: 2px 14px; border-radius: 10px; opacity: .85; pointer-events: none; animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp { from { transform: translateX(-50%) rotate(-12deg) scale(2.2); opacity: 0; } }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 72px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sun); border-radius: 4px; }
.bar.sea > i { background: var(--sea); }
.bar.mint > i { background: var(--mint); }
.pass-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start; }

/* ---------- 看板 ---------- */
.progress-ring { --p: 50; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--mint) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.progress-ring > div { width: 94px; height: 94px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1.1; }
.progress-ring b { font-size: 26px; font-variant-numeric: tabular-nums; }
.member-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); }
.mcard { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-width: 0; }
.mcard:hover { border-color: var(--sun); }
.mcard.me { border-color: var(--sea); }
.mcard .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .st { font-size: 12px; }
.mcard.pending { border-style: dashed; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.heat .d { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-variant-numeric: tabular-nums; max-width: 100%; }
.heat .wd { font-size: 11px; color: var(--muted); text-align: center; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty .art { font-size: 54px; line-height: 1; }

/* ---------- 偏好填写 ---------- */
.stepper { display: flex; gap: 6px; }
.stepper i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.stepper i.on { background: var(--sun); }
.step-wrap { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 18px; }
.cal-month { display: grid; gap: 6px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 12px; color: var(--muted); }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 14px; padding: 0; }
.cal button:hover { border-color: var(--sun); }
.cal button.sel { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); font-weight: 700; }
.cal button.anchor { outline: 3px solid var(--sea); outline-offset: 1px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--sun); color: var(--sun-ink); }
.pace-cards { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .pace-cards { grid-template-columns: 1fr; } }
.pace-card { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 14px; cursor: pointer; text-align: left; display: grid; gap: 4px; }
.pace-card .e { font-size: 26px; }
.pace-card.on { border-color: var(--sun); background: var(--sun-soft); }
.lock { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--mint); background: var(--mint-soft); padding: 8px 12px; border-radius: 10px; }
.persona { background: linear-gradient(135deg, var(--sun-soft), var(--sea-soft)); border-radius: var(--r); padding: 24px; display: grid; gap: 12px; text-align: center; justify-items: center; border: 1px solid var(--line); }
.foot-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- 行程 ---------- */
.group-head { display: grid; gap: 14px; }

.tl-slot { text-align: center; font-size: 12px; color: var(--muted); padding-top: 6px; }
.tl-slot .ic { width: 34px; height: 34px; margin: 0 auto 2px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 16px; }

.ticket-head { display: flex; gap: 10px; align-items: flex-start; }

/* ---------- AA ---------- */

function longestRun(dates) {
  const ns = [...new Set(dates.map(toDayNum))].sort((a, b) => a - b);
  let best = { start: null, len: 0 }, s = null, len = 0, prev = null;
  for (const n of ns) {
    if (prev !== null && n === prev + 1) len++; else { s = n; len = 1; }
    if (len > best.len) best = { start: s, len };
    prev = n;
  }
  return best.len ? { start: fromDayNum(best.start), len: best.len } : { start: null, len: 0 };

const _poiCache = {};
function getPoiLib(dest) {
  if (_poiCache[dest]) return _poiCache[dest];
  const raw = RAW_POIS[dest] || genericPois(dest);
  const code = (DEST_META[dest] && DEST_META[dest].code) || 'X' + (hashStr(dest) % 1000);
  const pois = raw.pois.map((r, i) => ({
    id: `${code}-${i}`, destination: dest, name: r[0], type: r[1],
    tags: r[2] ? r[2].split('|') : [], slots: r[3].split(''), cost: r[4],
    conflicts: r[5] ? r[5].split('|') : [], emoji: r[6],
  }));
  const stays = raw.stays.map((r, i) => ({ id: `${code}-S${i}`, destination: dest, name: r[0], type: 'stay', tier: r[1], cost: r[2], emoji: '🛏️' }));
  const byId = {};
  [...pois, ...stays].forEach(p => { byId[p.id] = p; });
  return (_poiCache[dest] = { pois, stays, byId });
}

function scorePair(a, b, allDests) {

  const run = longestRun(intersectDates([pa.availableDates, pb.availableDates]));
  const need = Math.min(pa.tripDays, pb.tripDays);
  const ovLo = Math.max(pa.budget[0], pb.budget[0]), ovHi = Math.min(pa.budget[1], pb.budget[1]);
  const dateOk = run.len >= need, budgetOk = ovHi >= ovLo;

  let best = 0, bestDest = null;
  const cands = new Set([...(pa.anyDestination ? allDests : pa.destinations), ...(pb.anyDestination ? allDests : pb.destinations)]);
  for (const d of cands) { const w = destWeight(pa, d) * destWeight(pb, d); if (w > best) { best = w; bestDest = d; } }

  const destination = best * 35;
  const date = Math.min(1, run.len / Math.max(pa.tripDays, pb.tripDays)) * 20;
  const wA = Math.max(1, pa.budget[1] - pa.budget[0]), wB = Math.max(1, pb.budget[1] - pb.budget[0]);
  const budget = Math.min(20, Math.max(0, ovHi - ovLo) / Math.min(wA, wB) * 20);
  const sa = new Set(pa.styles);
  const inter = pb.styles.filter(s => sa.has(s)).length;
  const uni = new Set([...pa.styles, ...pb.styles]).size;
  const style = uni ? inter / uni * 15 : 0;
  const pd = Math.abs(PACE_ORDER[pa.pace] - PACE_ORDER[pb.pace]);
  const pace = (pd === 0 ? 6 : pd === 1 ? 3 : 0) + (pa.stay === pb.stay ? 4 : 0);
  const aw = pa.buddies.includes(b.id), bw = pb.buddies.includes(a.id);
  const bonus = aw && bw ? 10 : (aw || bw ? 5 : 0);

  const total = Math.min(100, destination + date + budget + style + pace + bonus);
  return {
    total, breakdown: { destination, date, budget, style, pace, bonus },
    hardOk: dateOk && budgetOk, hardFail: !dateOk ? 'date' : (!budgetOk ? 'budget' : null), bestDest,
  };
}

function groupDates(ms) { return intersectDates(ms.map(m => m.preference.availableDates)); }
function groupBudget(ms) {
  return [Math.max(...ms.map(m => m.preference.budget[0])), Math.min(...ms.map(m => m.preference.budget[1]))];
}
function groupFeasible(ms) {
  const b = groupBudget(ms);
  return longestRun(groupDates(ms)).len >= 3 && b[1] >= b[0];
}
function avgScore(m, others, dests) {
  if (!others.length) return 0;
  return others.reduce((s, o) => s + scorePair(m, o, dests).total, 0) / others.length;
}
function majorityPace(ms) {
  const c = countBy(ms.map(m => m.preference.pace));
  const max = Math.max(...Object.values(c));
  const tops = Object.keys(c).filter(k => c[k] === max);
  return tops.length > 1 && tops.includes('normal') ? 'normal' : tops[0];
}

/** 主函数：输入活动和成员，输出组队结果 */
function matchTrip(trip, members) {
  const filled = members.filter(m => m.preference);
  const byId = Object.fromEntries(filled.map(m => [m.id, m]));
  const dests = trip.destinations;
  const cache = {};
  const S = (x, y) => { const k = x < y ? x + '|' + y : y + '|' + x; return cache[k] || (cache[k] = scorePair(byId[x], byId[y], dests)); };
  const avgWith = (id, ids) => ids.length ? ids.reduce((s, o) => s + S(id, o).total, 0) / ids.length : 0;
  const [minS, maxS] = trip.groupSize;

  // 目的地按热度排序
  const pop = dests.map(d => ({ d, w: filled.reduce((s, m) => s + destWeight(m.preference, d), 0) }))
    .sort((a, b) => b.w - a.w);

  const assigned = new Set();
  const raw = [];
  for (const { d } of pop) {
    const tried = new Set();
    for (;;) {
      const free = filled.filter(m => !assigned.has(m.id));
      const cands = free.filter(m => destWeight(m.preference, d) > 0).map(m => m.id);
      const seeds = free.filter(m => !m.preference.anyDestination && m.preference.destinations[0] === d && !tried.has(m.id)).map(m => m.id);
      if (!seeds.length) break;
      const seedScore = id => avgWith(id, cands.filter(c => c !== id));
      seeds.sort((x, y) => seedScore(y) - seedScore(x));
      const seed = seeds[0];
      tried.add(seed);
      const g = [seed];
      while (g.length < maxS) {
        let best = null, bs = -1;
        for (const c of cands) {
          if (g.includes(c)) continue;
          if (!g.every(x => S(c, x).hardOk)) continue;
          if (!groupFeasible([...g, c].map(i => byId[i]))) continue;
          const sc = avgWith(c, g);
          if (sc >= 60 && sc > bs) { bs = sc; best = c; }
        }
        if (!best) break;
        g.push(best);
      }
      if (g.length >= minS) { g.forEach(i => assigned.add(i)); raw.push({ destination: d, memberIds: g }); }
    }
  }

  // 剩余成员尝试插入现有团
  for (const m of filled.filter(m => !assigned.has(m.id))) {
    let best = null, bs = -1;
    for (const g of raw) {
      if (g.memberIds.length >= maxS) continue;
      if (!g.memberIds.every(x => S(m.id, x).hardOk)) continue;
      if (!groupFeasible([...g.memberIds, m.id].map(i => byId[i]))) continue;
      const sc = avgWith(m.id, g.memberIds);
      if (sc >= 50 && sc > bs) { bs = sc; best = g; }
    }
    if (best) { best.memberIds.push(m.id); assigned.add(m.id); }
  }

  const groups = raw.map((g, i) => recomputeGroup({
    id: uid('g'), tripCode: trip.code, index: i + 1, destination: g.destination,
    memberIds: g.memberIds, confirmedIds: [],
  }, byId, trip));
  return { tripCode: trip.code, groups, createdAt: Date.now(), stale: false };
}

/** 未分配成员：诊断原因并给出建议团 */
function diagnoseUnmatched(m, groups, byId, trip, matchCreatedAt) {
  let suggest = null, bestScore = -1;
  for (const g of groups) {
    const p = predictScore(m, g, byId, trip);
    const full = g.memberIds.length >= trip.groupSize[1];
    const rank = p.score + (p.hardOk ? 1000 : 0);   // 优先推荐没有硬冲突的团
    if (!full && rank > bestScore) { bestScore = rank; suggest = { groupId: g.id, score: p.score, hardOk: p.hardOk }; }
  }
  if (matchCreatedAt && (m.prefUpdatedAt || 0) > matchCreatedAt) {
    return { reason: '匹配之后才填写偏好，重新匹配会自动分团', suggest };
  }
  if (!groups.length) return { reason: '目前填写的同学还不够组成一个团', suggest };
  let allDate = true, allBudget = true;
  for (const g of groups) {
    const ms = g.memberIds.map(i => byId[i]).filter(Boolean);
    if (!ms.length) continue;
    const run = longestRun(intersectDates([groupDates(ms), m.preference.availableDates])).len;
    const gb = groupBudget(ms);
    if (run >= 3) allDate = false;
    if (Math.min(gb[1], m.preference.budget[1]) >= Math.max(gb[0], m.preference.budget[0])) allBudget = false;
  }
  const reason = allDate ? '可出行日期与现有团重叠不足 3 天'
    : allBudget ? '预算区间与现有团差距较大'
    : '暂时没有特别合拍的团，可以手动选择';
  return { reason, suggest };
}

/** 换团弹窗：某人加入某团后的预计匹配度 */
function predictScore(m, g, byId, trip) {
  const others = g.memberIds.filter(i => i !== m.id).map(i => byId[i]).filter(Boolean);
  if (!others.length) return { score: 0, hardOk: true };
  const res = others.map(o => scorePair(m, o, trip.destinations));
  const score = Math.round(res.reduce((s, r) => s + r.total, 0) / res.length);
  const fail = res.find(r => !r.hardOk);
  return { score, hardOk: !fail, hardFail: fail ? fail.hardFail : null };
}

/** 重算团的全部展示属性：日期、预算、匹配度、理由、风险 */
function recomputeGroup(group, byId, trip) {
  const ms = group.memberIds.map(i => byId[i]).filter(m => m && m.preference);
  const n = ms.length, d = group.destination;
  const run = longestRun(groupDates(ms));
  const want = Number(modeOf(ms.map(m => m.preference.tripDays), 5));
  const days = run.len ? Math.min(want, run.len) : 0;
  const dateWindow = days ? [run.start, addDays(run.start, days - 1)] : null;
  const budgetRange = n ? groupBudget(ms) : [0, 0];
  const budgetOk = budgetRange[1] >= budgetRange[0];

  // 两两得分
  const pairs = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pairs.push({ a: ms[i], b: ms[j], r: scorePair(ms[i], ms[j], trip.destinations) });
  const breakdown = { destination: 0, date: 0, budget: 0, style: 0, pace: 0, bonus: 0 };
  pairs.forEach(p => Object.keys(breakdown).forEach(k => { breakdown[k] += p.r.breakdown[k] / pairs.length; }));
  const score = pairs.length ? Math.round(pairs.reduce((s, p) => s + p.r.total, 0) / pairs.length) : 0;

  let leaderId = group.leaderId && group.memberIds.includes(group.leaderId) ? group.leaderId : null;
  if (!leaderId && n) {
    leaderId = ms.map(m => ({ id: m.id, s: avgScore(m, ms.filter(o => o !== m), trip.destinations) }))
      .sort((x, y) => y.s - x.s)[0].id;
  }

  // 风格统计
  const tagCount = countBy(ms.flatMap(m => m.preference.styles));
  const tagsSorted = Object.entries(tagCount).sort((x, y) => y[1] - x[1]);
  const pace = n ? majorityPace(ms) : 'normal';
  let flavor = tagsSorted.length ? GROUP_NAME_BY_TAG[tagsSorted[0][0]] : '快乐出发';
  if (tagsSorted.length && tagsSorted[0][0] === '海边度假' && pace === 'chill') flavor = '海风躺平';
  const name = `${d}·${flavor}团`;

  // ---- 推荐理由 ----
  const R = [];
  if (dateWindow) R.push({ k: 9, t: `${n} 人都能在 ${fmtMD(dateWindow[0])}–${fmtMD(dateWindow[1])} 出行，共同空档 ${run.len} 天` });
  const rankCount = [0, 0, 0]; let anyCount = 0;
  ms.forEach(m => { if (m.preference.anyDestination) anyCount++; else { const i = m.preference.destinations.indexOf(d); if (i >= 0) rankCount[i]++; } });
  if (rankCount[0] >= Math.ceil(n / 2)) {
    let t = `${rankCount[0]} 人首选${d}`;
    if (rankCount[1]) t += `，${rankCount[1]} 人次选${d}`;
    if (anyCount) t += `，${anyCount} 人去哪都行`;
    R.push({ k: breakdown.destination / 35 + 0.3, t });
  }
  if (budgetOk && breakdown.budget / 20 >= 0.6) R.push({ k: breakdown.budget / 20, t: `人均预算集中在 ¥${budgetRange[0]}–${budgetRange[1]}，差距小` });
  const sharedTags = tagsSorted.filter(([, c]) => c >= Math.ceil(n * 0.6));
  if (sharedTags.length) {
    R.push({ k: breakdown.style / 15 + 0.35, t: sharedTags.slice(0, 2).map(([t, c]) => `${c} 人选了「${t}」`).join('，') });
  }
  if (n > 1 && ms.every(m => m.preference.pace === ms[0].preference.pace)) R.push({ k: 0.9, t: `节奏都是「${PACE_LABEL[ms[0].preference.pace]}」，不会互相拖累` });
  const mutual = pairs.filter(p => p.a.preference.buddies.includes(p.b.id) && p.b.preference.buddies.includes(p.a.id));
  mutual.slice(0, 2).forEach(p => R.push({ k: 0.95, t: `${p.a.nickname}和${p.b.nickname}互选同行` }));
  const reasons = R.sort((x, y) => y.k - x.k).slice(0, 5).map(x => x.t);

  // ---- 风险提示 ----
  const W = [];
  const conflictNames = [];
  ms.forEach(m => {
    const f = ms.filter(o => o !== m).map(o => scorePair(m, o, trip.destinations)).find(r => !r.hardOk);
    if (f) conflictNames.push({ m, type: f.hardFail });
  });
  if (!budgetOk) W.push('⚠ 团内预算没有交集，建议先商量人均标准');
  if (run.len < 3) W.push('⚠ 共同空档不足 3 天，需要重新协商日期');
  conflictNames.slice(0, 2).forEach(({ m, type }) => W.push(`⚠ ${m.nickname}与团内${type === 'date' ? '可出行日期' : '预算'}不完全匹配`));
  ms.filter(m => m.preference.pace !== pace).slice(0, 1).forEach(m =>
    W.push(`${m.nickname}偏好「${PACE_LABEL[m.preference.pace]}」节奏，大家多为「${PACE_LABEL[pace]}」，行程里会留出自由活动时间`));
  if (budgetOk && budgetRange[1] - budgetRange[0] < 300) W.push('有成员预算接近区间边缘，行程会优先选择经济型住宿');
  ms.forEach(m => {
    if (m.preference.anyDestination) return;
    const i = m.preference.destinations.indexOf(d);
    if (i === 2) W.push(`${m.nickname}的第三志愿是${d}，出发前可以再确认一下`);
    if (i === -1) W.push(`${m.nickname}没有选${d}，记得问问 TA 的想法`);
  });

  return {
    ...group, name, days, dateWindow, budgetRange, budgetOk, runLen: run.len, score, breakdown, leaderId, pace,
    confirmedIds: (group.confirmedIds || []).filter(i => group.memberIds.includes(i)),
    reasons, warnings: W.slice(0, 4),
  };
}

/* ---- core/itinerary.js ---- */
/* ============ core/itinerary.js · 行程生成（团画像 × 节奏模板 × 资源库打分） ============ */
const DAILY_FOOD_BASE = 60;   // 行程外的基础餐费 / 人 / 天
const DAILY_TRANSPORT = 30;   // 市内交通 / 人 / 天

function groupProfile(ms) {
  const tagWeight = countBy(ms.flatMap(m => m.preference.styles));
  const exclusions = [...new Set(ms.flatMap(m => m.preference.dislikes))];
  const pace = ms.length ? majorityPace(ms) : 'normal';
  const stayMode = modeOf(ms.map(m => m.preference.stay), 'budget');
  return { tagWeight, exclusions, pace, stayMode, size: ms.length };
}

function slotsForPace(pace) {
  return pace === 'rush' ? ['m', 'a', 'e', 'n'] : ['m', 'a', 'e'];
}
function poiFitsSlot(p, slot) {
  if (slot === 'n') return p.slots.includes('e') && (p.type === 'n' || p.type === 'f');
  return p.slots.includes(slot);
}
function poiConflicts(p, prof) { return p.conflicts.some(c => prof.exclusions.includes(c)); }
function poiScore(p, prof, slot) {
  let s = p.tags.reduce((t, x) => t + (prof.tagWeight[x] || 0), 0);
  if (slot === 'e' && p.type === 'f') s += 2;
  if ((slot === 'm' || slot === 'a') && p.type === 'f') s -= 1;
  if (slot === 'n' && p.type === 'n') s += 1;
  return s;
}
function reasonFor(p, prof, relaxed) {
  const top = p.tags.map(t => [t, prof.tagWeight[t] || 0]).sort((a, b) => b[1] - a[1])[0];
  let r = top && top[1] > 0 ? `团里 ${top[1]} 人选了「${top[0]}」`
    : ({ f: '当地特色，顺路尝一尝', s: '目的地经典打卡点', a: '换换节奏的体验项目', n: '看看城市的夜晚' }[p.type]);
  if (relaxed) r += '（同类可选项不多，已尽量照顾大家）';
  return r;
}

/** 从资源库中为某时段挑一个 POI */
function pickPoi(lib, slot, used, prof, rand, exclude = [], preferType = null) {
  const base = lib.pois.filter(p => poiFitsSlot(p, slot) && !used.has(p.id) && !exclude.includes(p.id));
  let c = base.filter(p => !poiConflicts(p, prof)), relaxed = false;
  if (!c.length && base.length) { c = base; relaxed = true; }
  if (!c.length) return null;
  let best = null, bs = -Infinity;
  for (const p of c) {
    const s = poiScore(p, prof, slot) + (preferType && p.type === preferType ? 3 : 0) + rand() * 0.5;
    if (s > bs) { bs = s; best = p; }
  }
  return { poi: best, relaxed };
}

function pickStay(lib, budgetRange, stayMode) {
  const mid = (budgetRange[0] + budgetRange[1]) / 2;
  const tiers = mid < 2000 ? ['hostel', 'budget'] : mid <= 3500 ? ['budget', 'bnb', 'comfort'] : ['bnb', 'comfort'];
  const pool = lib.stays.filter(s => tiers.includes(s.tier));
  return pool.find(s => s.tier === stayMode) || pool[Math.floor(pool.length / 2)] || lib.stays[0];
}

function newItem(slot, extra) {
  return { id: uid('it'), slot, poiId: null, fixed: null, reason: '', votes: {}, tried: [], ...extra };
}

/** 主函数：生成整团行程 */
function generateItinerary(group, ms, seed) {
  const lib = getPoiLib(group.destination);
  const prof = groupProfile(ms);
  const s = seed == null ? hashStr(group.id) : seed;
  const rand = seededRandom(s);
  const days = Math.max(group.days || 3, 1);
  const start = group.dateWindow ? group.dateWindow[0] : '2026-06-20';
  const used = new Set();
  const dayPlans = [];

  for (let di = 0; di < days; di++) {
    const items = [];
    for (const slot of slotsForPace(prof.pace)) {
      const isLast = di === days - 1;
      if (di === 0 && slot === 'm') { items.push(newItem(slot, { fixed: { title: '抵达 & 办理入住', emoji: '🧳', note: '先把行李放下，轻装出发' } })); continue; }
      if (isLast && slot === 'n') continue;
      if (isLast && slot === 'e' && days > 1) { items.push(newItem(slot, { fixed: { title: '收拾行李，返程', emoji: '🚄', note: '记得带上纪念品和照片' } })); continue; }
      if (prof.pace === 'chill' && slot === 'm') { items.push(newItem(slot, { fixed: { title: '睡到自然醒', emoji: '😴', note: '团里多数人选了「躺平」节奏' } })); continue; }
      const r = pickPoi(lib, slot, used, prof, rand);
      if (r) { used.add(r.poi.id); items.push(newItem(slot, { poiId: r.poi.id, reason: reasonFor(r.poi, prof, r.relaxed) })); }
      else items.push(newItem(slot, { reason: '自由活动' }));
    }
    dayPlans.push({ date: addDays(start, di), items });
  }
  const stay = pickStay(lib, group.budgetRange || [2000, 3000], prof.stayMode);
  const it = {
    groupId: group.id, destination: group.destination, days: dayPlans, stayPoiId: stay.id, profile: prof,
    seed: s, memberSig: group.memberIds.slice().sort().join(','), generatedAt: Date.now(),
  };
  it.estimate = estimateItinerary(it);
  return it;
}

function estimateItinerary(it) {
  const lib = getPoiLib(it.destination);
  const days = it.days.length;
  let tickets = 0, food = 0;
  it.days.forEach(d => d.items.forEach(item => {
    const p = item.poiId && lib.byId[item.poiId];
    if (!p) return;
    if (p.type === 'f') food += p.cost; else tickets += p.cost;
  }));
  food += DAILY_FOOD_BASE * days;
  const stayP = lib.byId[it.stayPoiId];
  const stay = stayP ? stayP.cost * Math.max(1, days - 1) : 0;
  const transport = DAILY_TRANSPORT * days;
  return { stay, food, tickets, transport, total: stay + food + tickets + transport };
}

function usedPoiIds(it) {
  return new Set(it.days.flatMap(d => d.items.map(i => i.poiId)).filter(Boolean));
}
function mapItem(it, dayIdx, itemId, fn) {
  const days = it.days.map((d, i) => i !== dayIdx ? d : { ...d, items: d.items.map(x => x.id === itemId ? fn(x) : x) });
  const next = { ...it, days };
  next.estimate = estimateItinerary(next);
  return next;
}
function findItem(it, dayIdx, itemId) { return it.days[dayIdx].items.find(x => x.id === itemId); }

/** 🔄 换一个同类：资源用尽时返回 null */
function replaceItem(it, dayIdx, itemId) {
  const lib = getPoiLib(it.destination);
  const item = findItem(it, dayIdx, itemId);
  if (!item || item.fixed) return null;
  const cur = item.poiId && lib.byId[item.poiId];
  const tried = [...(item.tried || []), ...(item.poiId ? [item.poiId] : [])];
  const rand = seededRandom(hashStr(item.id + tried.length));
  const r = pickPoi(lib, item.slot, usedPoiIds(it), it.profile, rand, tried, cur ? cur.type : null);
  if (!r) return null;
  return mapItem(it, dayIdx, itemId, x => ({ ...x, poiId: r.poi.id, reason: reasonFor(r.poi, it.profile, r.relaxed), tried, votes: {} }));
}
/** 🗑 删除 → 变成自由活动 */
function removeItem(it, dayIdx, itemId) {
  return mapItem(it, dayIdx, itemId, x => ({ ...x, poiId: null, reason: '自由活动', votes: {}, tried: [] }));
}
/** + 添加：候选列表与插入 */
function addCandidates(it, dayIdx, itemId) {
  const lib = getPoiLib(it.destination);
  const item = findItem(it, dayIdx, itemId);
  const used = usedPoiIds(it);
  return lib.pois.filter(p => poiFitsSlot(p, item.slot) && !used.has(p.id))
    .map(p => ({ poi: p, score: poiScore(p, it.profile, item.slot), conflict: poiConflicts(p, it.profile) }))
    .sort((a, b) => (a.conflict - b.conflict) || (b.score - a.score));
}
function addItem(it, dayIdx, itemId, poiId) {
  const p = getPoiLib(it.destination).byId[poiId];
  return mapItem(it, dayIdx, itemId, x => ({ ...x, poiId, reason: reasonFor(p, it.profile, false) + ' · 手动添加', votes: {}, tried: [] }));
}
/** 👍/👎：同一票再点一次为撤销 */
function voteItem(it, dayIdx, itemId, memberId, v) {
  return mapItem(it, dayIdx, itemId, x => {
    const votes = { ...x.votes };
    if (votes[memberId] === v) delete votes[memberId]; else votes[memberId] = v;
    return { ...x, votes };
  });
}
/** 住宿：换一家（循环） / 换更便宜的 */
function nextStay(it) {
  const lib = getPoiLib(it.destination);
  const list = lib.stays.slice().sort((a, b) => a.cost - b.cost);
  const i = list.findIndex(s => s.id === it.stayPoiId);
  const next = { ...it, stayPoiId: list[(i + 1) % list.length].id };
  next.estimate = estimateItinerary(next);
  return next;
}
function cheaperStay(it) {
  const lib = getPoiLib(it.destination);
  const cur = lib.byId[it.stayPoiId];
  const cheaper = lib.stays.filter(s => s.cost < cur.cost).sort((a, b) => b.cost - a.cost)[0];
  if (!cheaper) return null;
  const next = { ...it, stayPoiId: cheaper.id };
  next.estimate = estimateItinerary(next);
  return next;
}

/** 文字版行程（复制到群里） */
function itineraryText(it, group, membersById) {
  const lib = getPoiLib(it.destination);
  const lines = [`【${group.name}】${fmtMD(group.dateWindow ? group.dateWindow[0] : it.days[0].date)}–${fmtMD(it.days[it.days.length - 1].date)} · ${group.memberIds.length} 人`];
  lines.push(`成员：${group.memberIds.map(i => membersById[i] ? membersById[i].nickname : '').join('、')}`);
  lines.push(`住宿：${lib.byId[it.stayPoiId].name}`);
  it.days.forEach((d, i) => {

}

/* ---- core/settle.js ---- */
/* ============ core/settle.js · AA 分摊与最少转账（金额单位：分） ============ */

/** 每人：已垫付 / 应承担 / 差额（net > 0 应收，< 0 应付） */
function computeBalances(expenses, memberIds) {
  const ids = new Set(memberIds);
  expenses.forEach(e => { ids.add(e.payerId); e.participantIds.forEach(p => ids.add(p)); });
  const bal = {};
  ids.forEach(id => { bal[id] = { paid: 0, owed: 0, net: 0 }; });
  for (const e of expenses) {
    const ps = e.participantIds.slice().sort();
    if (!ps.length) continue;
    const share = Math.floor(e.amount / ps.length);
    const rem = e.amount - share * ps.length;      // 余数逐分分给排序靠前的人，总额精确
    bal[e.payerId].paid += e.amount;
    ps.forEach((p, i) => { bal[p].owed += share + (i < rem ? 1 : 0); });
  }
  Object.values(bal).forEach(b => { b.net = b.paid - b.owed; });
  return bal;
}

/** 贪心：最大债务人转给最大债权人，笔数 ≤ n-1 */
function settle(balances) {
  const cred = [], debt = [];
  Object.entries(balances).forEach(([id, b]) => {
    if (b.net > 0) cred.push({ id, amt: b.net });
    else if (b.net < 0) debt.push({ id, amt: -b.net });
  });
  const sorter = (a, b) => (b.amt - a.amt) || (a.id < b.id ? -1 : 1);
  const out = [];
  while (cred.length && debt.length) {
    cred.sort(sorter); debt.sort(sorter);
    const c = cred[0], d = debt[0];
    const amt = Math.min(c.amt, d.amt);
    out.push({ from: d.id, to: c.id, amount: amt });
    c.amt -= amt; d.amt -= amt;
    if (!c.amt) cred.shift();
    if (!d.amt) debt.shift();
  }
  return out;
}
function transferKey(t) { return `${t.from}->${t.to}:${t.amount}`; }

/* ---- store.js ---- */
/* ============ store.js · 全局状态 + localStorage 持久化 + 所有业务动作 ============ */
const STORE_KEY = 'gradtrip.v1';

function emptyState() {
  return { trips: {}, members: {}, matches: {}, itineraries: {}, expenses: {}, paid: {}, current: {}, lastTrip: null };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(emptyState(), JSON.parse(raw));
  } catch (e) { /* 隐私模式等：退回内存状态 */ }
  return emptyState();
}
let S = loadState();
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------- 查询 ---------- */
const Q = {
  trip: code => S.trips[code],
  members: code => Object.values(S.members).filter(m => m.tripCode === code).sort((a, b) => a.joinedAt - b.joinedAt),
  filled: code => Q.members(code).filter(m => m.preference),
  byId: code => Object.fromEntries(Q.members(code).map(m => [m.id, m])),
  me: code => S.members[S.current[code]] || null,
  match: code => S.matches[code] || null,
  group: (code, gid) => { const m = S.matches[code]; return m ? m.groups.find(g => g.id === gid) : null; },
  groupOf: (code, mid) => { const m = S.matches[code]; return m ? m.groups.find(g => g.memberIds.includes(mid)) : null; },
  unmatched: code => {
    const match = S.matches[code]; if (!match) return [];
    const trip = S.trips[code];
    const inG = new Set(match.groups.flatMap(g => g.memberIds));
    const byId = Q.byId(code);
    return Q.filled(code).filter(m => !inG.has(m.id)).map(m => ({ member: m, ...diagnoseUnmatched(m, match.groups, byId, trip, match.createdAt) }));
  },
  expenses: gid => Object.values(S.expenses).filter(e => e.groupId === gid).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt)),
};

/* ---------- 动作 ---------- */
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c;
  do { c = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); } while (S.trips[c]);
  return c;
}

const Store = {
  createTrip(f) {
    const code = genCode();
    const creator = { id: uid('m'), tripCode: code, nickname: f.nickname.trim(), avatar: f.avatar || '🦊', joinedAt: Date.now(), preference: null };
    S.trips[code] = {
      code, name: f.name.trim(), dateRange: [f.start, f.end], groupSize: [f.min, f.max],
      destinations: f.dests.slice(), deadline: f.deadline || '', creatorId: creator.id, createdAt: Date.now(),
    };
    S.members[creator.id] = creator;
    S.current[code] = creator.id;
    S.lastTrip = code;
    persist();
    return code;
  },

  /** 保存偏好：memberId 为空时新建成员 */
  savePreference(code, memberId, draft) {
    const pref = {
      availableDates: draft.availableDates.slice().sort(), tripDays: draft.tripDays, budget: draft.budget.slice(),
      destinations: draft.anyDestination ? [] : draft.destinations.slice(), anyDestination: draft.anyDestination,
      styles: draft.styles.slice(), pace: draft.pace, stay: draft.stay, buddies: draft.buddies.slice(), dislikes: draft.dislikes.slice(),
    };
    let m = memberId && S.members[memberId];
    if (m) {
      m.nickname = draft.nickname.trim(); m.avatar = draft.avatar; m.preference = pref; m.prefUpdatedAt = Date.now();
    } else {
      m = { id: uid('m'), tripCode: code, nickname: draft.nickname.trim(), avatar: draft.avatar, joinedAt: Date.now(), prefUpdatedAt: Date.now(), preference: pref };
      S.members[m.id] = m;
    }
    S.current[code] = m.id;
    S.lastTrip = code;
    const match = S.matches[code];
    if (match) { match.stale = true; Store._refresh(code); }
    persist();
    return m.id;
  },

  loadDemo() {
    Store._wipeTrip(DEMO_CODE);
    const { trip, members } = buildDemo();
    S.trips[trip.code] = trip;
    members.forEach(m => { S.members[m.id] = m; });
    S.current[trip.code] = trip.creatorId;
    S.lastTrip = trip.code;
    persist();
    return trip.code;
  },

  addMockMember(code) {
    const m = makeMockMember(S.trips[code], Q.members(code));
    S.members[m.id] = m;
    if (S.matches[code]) S.matches[code].stale = true;
    persist();
    return m;
  },

  setCurrent(code, mid) { S.current[code] = mid; persist(); },

  runMatch(code) {
    const old = S.matches[code];
    if (old) old.groups.forEach(g => Store._wipeGroup(g.id));
    S.matches[code] = matchTrip(S.trips[code], Q.members(code));
    persist();
    return S.matches[code];
  },

  /** 成员或偏好变化后，重算所有团的属性 */
  _refresh(code) {
    const match = S.matches[code]; if (!match) return;
    const byId = Q.byId(code), trip = S.trips[code];
    match.groups = match.groups.map(g => recomputeGroup({ ...g, memberIds: g.memberIds.filter(i => byId[i] && byId[i].preference) }, byId, trip));
  },

  moveMember(code, mid, toGid) {
    const match = S.matches[code];
    match.groups.forEach(g => { g.memberIds = g.memberIds.filter(i => i !== mid); g.confirmedIds = g.confirmedIds.filter(i => i !== mid); if (g.leaderId === mid) g.leaderId = null; });
    if (toGid) {
      const g = match.groups.find(x => x.id === toGid);
      g.memberIds.push(mid);
      g.confirmedIds.push(mid);   // 主动换入 = 确认加入
    }
    Store._refresh(code);
    persist();
  },

  toggleConfirm(code, gid, mid) {
    const g = Q.group(code, gid);
    if (g.confirmedIds.includes(mid)) g.confirmedIds = g.confirmedIds.filter(i => i !== mid);
    else g.confirmedIds.push(mid);
    persist();
    return g.confirmedIds.length === g.memberIds.length;
  },

  generatePlan(code, gid, fresh) {
    const g = Q.group(code, gid);
    const byId = Q.byId(code);
    const seed = fresh ? Math.floor(Math.random() * 1e9) : undefined;
    S.itineraries[gid] = generateItinerary(g, g.memberIds.map(i => byId[i]).filter(m => m && m.preference), seed);
    persist();
    return S.itineraries[gid];
  },
  setPlan(gid, it) { if (it) { S.itineraries[gid] = it; persist(); } return !!it; },

  upsertExpense(gid, e) {
    const id = e.id || uid('e');
    S.expenses[id] = { ...e, id, groupId: gid, createdAt: e.createdAt || Date.now() };
    const reset = Store._checkPaid(gid);
    persist();
    return reset;
  },
  deleteExpense(gid, id) { delete S.expenses[id]; const r = Store._checkPaid(gid); persist(); return r; },
  importDemoExpenses(code, gid) {
    const g = Q.group(code, gid);
    demoExpenses(g, Q.byId(code), S.itineraries[gid]).forEach((e, i) => {
      const id = uid('e');
      S.expenses[id] = { ...e, id, groupId: gid, createdAt: Date.now() + i };
    });
    Store._checkPaid(gid);
    persist();
  },
  /** 账单变化导致结算方案变化时，清空已转标记；返回是否清空 */
  _checkPaid(gid) {
    const paid = S.paid[gid] || [];
    if (!paid.length) return false;
    const code = Object.keys(S.matches).find(c => S.matches[c].groups.some(g => g.id === gid));
    const g = code && Q.group(code, gid);
    const keys = new Set(settle(computeBalances(Q.expenses(gid), g ? g.memberIds : [])).map(transferKey));
    if (paid.some(k => !keys.has(k))) { S.paid[gid] = []; return true; }
    return false;
  },
  togglePaid(gid, key) {
    const list = S.paid[gid] || [];
    S.paid[gid] = list.includes(key) ? list.filter(k => k !== key) : [...list, key];
    persist();
  },

  _wipeGroup(gid) {
    delete S.itineraries[gid];
    delete S.paid[gid];
    Object.keys(S.expenses).forEach(k => { if (S.expenses[k].groupId === gid) delete S.expenses[k]; });
  },
  _wipeTrip(code) {
    if (S.matches[code]) S.matches[code].groups.forEach(g => Store._wipeGroup(g.id));
    delete S.matches[code];
    Object.keys(S.members).forEach(k => { if (S.members[k].tripCode === code) delete S.members[k]; });
    delete S.trips[code];
    delete S.current[code];
  },
  resetAll() { S = emptyState(); try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } },
};

function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti');
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const colors = ['#F2672A', '#2F7FE0', '#1F9E6A', '#FFD23F', '#F2709A'];
  const ps = Array.from({ length: 140 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)],
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++t < 110) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })();
}

/* ============ pages/create.js · 创建旅行团 ============ */
const RANDOM_NAMES = ['毕业了，去成都吃到扶墙出', '最后一个暑假，海边见', '四年同窗，一起出发', '答辩完就跑路', '把青春留在路上', '不散伙旅行团'];

function initCreate() {
  ui.create = {
    name: '', start: '2026-06-15', end: '2026-07-15', min: 3, max: 8,
    all: DEFAULT_DESTS.slice(), dests: DEFAULT_DESTS.slice(0, 6), custom: '', deadline: '2026-06-10',
    nickname: '', avatar: '🦊', errors: {}, dirty: false,
  };
}

function pageCreate() {
  if (!ui.create) initCreate();
  const c = ui.create, e = c.errors;
  return `
  <div class="row between">
    <div><div class="eyebrow">新建活动</div><h2>创建旅行团</h2></div>
    <button class="btn ghost" data-act="create.back">← 返回</button>
  </div>
  <div class="grid-2">
    <div class="card form-grid">
      <div class="field">
        <label for="c-name">活动名称</label>
        <div class="input-row">
          <input id="c-name" class="input ${e.name ? 'err' : ''}" maxlength="30" placeholder="如：2026 届软工 3 班毕业旅行" value="${esc(c.name)}" data-in="create" data-k="name">
          <button class="icon-btn" data-act="create.random" title="随机一个名字">🎲</button>
        </div>
        ${e.name ? `<span class="err-text">${e.name}</span>` : ''}
      </div>
      <div class="two">
        <div class="field"><label for="c-start">最早出发</label><input id="c-start" type="date" class="input ${e.date ? 'err' : ''}" value="${c.start}" data-in="create" data-k="start"></div>
        <div class="field"><label for="c-end">最晚返回</label><input id="c-end" type="date" class="input ${e.date ? 'err' : ''}" value="${c.end}" data-in="create" data-k="end"></div>
      </div>
      ${e.date ? `<span class="err-text">${e.date}</span>` : ''}
      <div class="two">
        <div class="field"><label for="c-min">每团最少</label>
          <select id="c-min" class="input" data-ch="create" data-k="min">${[2, 3, 4, 5].map(n => `<option value="${n}" ${n === c.min ? 'selected' : ''}>${n} 人</option>`).join('')}</select></div>
        <div class="field"><label for="c-max">每团最多</label>
          <select id="c-max" class="input" data-ch="create" data-k="max">${[4, 5, 6, 8, 10, 12].map(n => `<option value="${n}" ${n === c.max ? 'selected' : ''}>${n} 人</option>`).join('')}</select></div>
      </div>
      ${e.size ? `<span class="err-text">${e.size}</span>` : ''}
      <div class="field">
        <span class="label">目的地候选池 <span class="muted small">（已选 ${c.dests.length} 个，同学们从中选志愿）</span></span>
        <div class="chips">${c.all.map(d => `<button class="chip ${c.dests.includes(d) ? 'on' : ''}" data-act="create.dest" data-d="${esc(d)}">${destEmoji(d)} ${esc(d)}</button>`).join('')}</div>
        <div class="input-row" style="margin-top:4px">
          <input id="c-custom" class="input" maxlength="8" placeholder="+ 自定义目的地，回车添加" value="${esc(c.custom)}" data-in="create" data-k="custom" data-enter="create.addDest">
          <button class="btn" data-act="create.addDest">添加</button>
        </div>
        ${e.dests ? `<span class="err-text">${e.dests}</span>` : ''}
      </div>
      <div class="two">
        <div class="field"><label for="c-deadline">填写截止（可选）</label><input id="c-deadline" type="date" class="input" value="${c.deadline}" data-in="create" data-k="deadline"></div>
        <div class="field"><label for="c-nick">我的昵称（发起人）</label><input id="c-nick" class="input ${e.nickname ? 'err' : ''}" maxlength="10" placeholder="同学们怎么称呼你" value="${esc(c.nickname)}" data-in="create" data-k="nickname">
          ${e.nickname ? `<span class="err-text">${e.nickname}</span>` : ''}</div>
      </div>
      <button class="btn primary lg block" data-act="create.submit">创建旅行团</button>
    </div>
    <div class="stack" style="align-content:start">
      <span class="label muted">邀请卡片预览（实时更新）</span>
      <div id="create-preview">${createPreview()}</div>
    </div>
  </div>`;
}

function createPreview() {
  const c = ui.create;
  const days = c.start && c.end && c.end >= c.start ? dateList(c.start, c.end).length : 0;
  return `
  <article class="pass">
    <div class="pass-top mono"><span>GRADTRIP · INVITATION</span><span>CODE ••••••</span></div>
    <div class="pass-main">
      <h3 style="font-family:var(--f-display);font-weight:400;font-size:24px">${esc(c.name) || '<span class="muted">给旅行团起个名字</span>'}</h3>
      <div class="pass-fields">
        <div class="pf"><small>FROM</small><b>${c.start ? fmtMD(c.start) : '—'}</b></div>
        <div class="pf"><small>TO</small><b>${c.end ? fmtMD(c.end) : '—'}</b></div>
        <div class="pf"><small>WINDOW</small><b>${days} 天</b></div>
        <div class="pf"><small>GROUP</small><b>${c.min}–${c.max} 人</b></div>
      </div>
    </div>
    <div class="perf"></div>
    <div class="pass-body">
      <div class="chips">${c.dests.map(d => `<span class="tag sun">${destEmoji(d)} ${esc(d)}</span>`).join('') || '<span class="muted small">还没有选目的地</span>'}</div>
      <p class="small muted">发起人：${esc(c.nickname) || '—'} ${c.deadline ? `· ${fmtMD(c.deadline)} 前填写偏好` : ''}</p>
    </div>
  </article>`;
}
function refreshPreview() { const el = document.getElementById('create-preview'); if (el) el.innerHTML = createPreview(); }

IN.create = el => { ui.create[el.dataset.k] = el.value; ui.create.dirty = true; if (el.dataset.k !== 'custom') refreshPreview(); };
CH.create = el => { ui.create[el.dataset.k] = Number(el.value); ui.create.dirty = true; refreshPreview(); };
A['create.random'] = () => {
  const c = ui.create; let n;
  do { n = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)]; } while (n === c.name && RANDOM_NAMES.length > 1);
  c.name = n; c.dirty = true; delete c.errors.name; render();
};
A['create.dest'] = d => {
  const c = ui.create;
  c.dests = c.dests.includes(d.d) ? c.dests.filter(x => x !== d.d) : [...c.dests, d.d];
  c.dirty = true; render();
};
A['create.addDest'] = () => {
  const c = ui.create; const v = (c.custom || '').trim();
  if (!v) { toast('先输入目的地名称'); return; }
  if (c.all.includes(v)) { toast('已经有啦'); if (!c.dests.includes(v)) c.dests.push(v); c.custom = ''; render(); return; }
  c.all.push(v); c.dests.push(v); c.custom = ''; c.dirty = true; delete c.errors.dests;
  render(); toast(`已添加「${v}」`);
};
A['create.back'] = () => {
  if (ui.create && ui.create.dirty) askConfirm({ title: '放弃创建？', body: '已填写的内容不会保存。', ok: '放弃', danger: true, onOk: () => { initCreate(); go('/'); } });
  else go('/');
};
A['create.submit'] = () => {
  const c = ui.create; const e = {};
  if (!c.name.trim()) e.name = '给旅行团起个名字吧';
  if (!c.start || !c.end || c.end < c.start) e.date = '返回日期要晚于出发日期';
  else if (dateList(c.start, c.end).length < 3) e.date = '时间范围至少 3 天';
  if (c.min > c.max) e.size = '最少人数不能大于最多人数';
  if (c.dests.length < 2) e.dests = '至少选 2 个目的地，才有得挑';
  if (!c.nickname.trim()) e.nickname = '填一个昵称';
  c.errors = e;
  if (Object.keys(e).length) {
    render();
    const first = document.querySelector('.input.err, .err-text');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const code = Store.createTrip(c);
  initCreate();
  ui.modal = { type: 'created', code };
  render();
  confetti();
};

/* ---- pages/join.js ---- */
/* ============ pages/join.js · 成员偏好填写（5 步） ============ */
const STEP_TITLES = ['我是谁', '什么时候有空', '人均预算', '想去哪', '旅行风格'];

function blankDraft() {
  return { nickname: '', avatar: AVATARS[Math.floor(Math.random() * 12)], availableDates: [], tripDays: 5, budget: [1500, 3000],
    destinations: [], anyDestination: false, styles: [], pace: 'normal', stay: 'budget', buddies: [], dislikes: [] };
}
function initJoin(code) {
  const me = ui.joinIntent === 'new' ? null : Q.me(code);
  const d = blankDraft();
  if (me) {
    d.nickname = me.nickname; d.avatar = me.avatar;
    if (me.preference) Object.assign(d, JSON.parse(JSON.stringify(me.preference)));
  }
  ui.join = { code, step: 1, draft: d, memberId: me ? me.id : null, editing: !!(me && me.preference), anchor: null, rangeMode: true, done: false };
  ui.joinIntent = null;
}

function stepError(step, d) {
  if (step === 1 && !d.nickname.trim()) return '先填一个昵称';
  if (step === 2 && d.availableDates.length < 3) return '至少选 3 天可出行日期';
  if (step === 4 && !d.anyDestination && !d.destinations.length) return '至少选 1 个目的地，或打开「去哪都行」';
  if (step === 5 && !d.styles.length) return '至少选 1 个旅行风格';
  return '';
}

function pageJoin(code) {
  const trip = Q.trip(code);
  if (!trip) return emptyView('🧭', '这个团不存在', '检查一下邀请码，或者回首页载入示例。', navBtn('/', '回首页', 'btn primary'));
  if (!ui.join || ui.join.code !== code) initJoin(code);
  const j = ui.join, d = j.draft;
  if (j.done) return joinDone(trip);
  const err = stepError(j.step, d);
  const matched = !!Q.match(code);
  return `
  <div class="step-wrap">
    <div class="row between">
      <div><div class="eyebrow">${esc(trip.name)}</div><h2>${j.editing ? '修改我的偏好' : '填写旅行偏好'}</h2></div>
      <span class="tag mono">${j.step} / 5 · ${STEP_TITLES[j.step - 1]}</span>
    </div>
    <div class="stepper">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= j.step ? 'on' : ''}"></i>`).join('')}</div>
    ${j.editing && matched ? `<div class="banner"><span>💡</span><div class="grow small">已经组过队了，修改后需要发起人点「重新匹配」才会更新分组。</div></div>` : ''}
    <div class="card form-grid">${[step1, step2, step3, step4, step5][j.step - 1](trip, d)}</div>
    <div class="foot-nav">
      ${j.step > 1 ? `<button class="btn" data-act="join.prev">← 上一步</button>` : navBtn(`/t/${code}`, '去看板', 'btn ghost')}
      <div class="row">
        ${err ? `<span class="hint warn">${err}</span>` : ''}
        ${j.step < 5 ? `<button class="btn primary" data-act="join.next" ${err ? 'disabled' : ''}>下一步 →</button>`
          : `<button class="btn primary" data-act="join.submit" ${err ? 'disabled' : ''}>${j.editing ? '保存修改' : '提交偏好'} ✓</button>`}
      </div>
    </div>
  </div>`;
}

function step1(trip, d) {
  return `
  <div class="field"><label for="j-nick">昵称</label>
    <input id="j-nick" class="input" maxlength="10" placeholder="同学们怎么称呼你" value="${esc(d.nickname)}" data-in="join.nick" data-enter="join.next"></div>
  <div class="field"><span class="label">选一个头像</span>
    <div class="chips">${AVATARS.map(a => `<button class="chip ${d.avatar === a ? 'on' : ''}" style="font-size:20px;padding:4px 10px" data-act="join.avatar" data-a="${a}">${a}</button>`).join('')}</div></div>`;
}

function step2(trip, d) {
  const j = ui.join;
  const all = dateList(trip.dateRange[0], trip.dateRange[1]);
  const sel = new Set(d.availableDates);
  const months = {};
  all.forEach(s => { const k = s.slice(0, 7); (months[k] = months[k] || []).push(s); });
  const run = longestRun(d.availableDates);
  return `
  <div class="row between">
    <span class="label">在日历上选出你有空的日子</span>
    <div class="row">
      <button class="chip ${j.rangeMode ? 'on' : ''}" data-act="join.rangeMode">${j.rangeMode ? '区间模式：点起点再点终点' : '单选模式：逐天点选'}</button>
      <button class="btn sm ghost" data-act="join.clearDates">清空</button>
    </div>
  </div>
  ${Object.entries(months).map(([k, days]) => {
    const lead = new Date(toDayNum(days[0]) * DAY_MS).getUTCDay();
    return `<div class="cal-month"><b class="small">${Number(k.slice(5))} 月</b>
      <div class="cal">${'日一二三四五六'.split('').map(w => `<span class="wd">${w}</span>`).join('')}
      ${'<span></span>'.repeat(lead)}
      ${days.map(s => `<button class="${sel.has(s) ? 'sel' : ''} ${j.anchor === s ? 'anchor' : ''}" data-act="join.day" data-d="${s}" aria-pressed="${sel.has(s)}">${Number(s.slice(8))}</button>`).join('')}</div></div>`;
  }).join('')}
  <p class="small ${run.len && run.len < d.tripDays ? 'hint warn' : 'muted'}">已选 ${d.availableDates.length} 天，最长连续 ${run.len} 天${run.len && run.len < d.tripDays ? `，比期望天数短，可能不容易成团` : ''}</p>
  <div class="field"><span class="label">期望玩几天</span>
    <div class="seg">${[3, 5, 7].map(n => `<button class="${d.tripDays === n ? 'on' : ''}" data-act="join.days" data-n="${n}">${n} 天</button>`).join('')}</div></div>`;
}

function step3(trip, d) {
  const L = 500, H = 6000;
  const pct = v => (v - L) / (H - L) * 100;
  return `
  <div class="field"><span class="label">人均预算（不含往返大交通）</span>
    <div class="big-num num" id="budget-label">¥${d.budget[0]} – ¥${d.budget[1]}</div>
    <div class="dual">
      <div class="track"></div><div class="fill" id="budget-fill" style="left:${pct(d.budget[0])}%;right:${100 - pct(d.budget[1])}%"></div>
      <input type="range" id="bmin" min="${L}" max="${H}" step="100" value="${d.budget[0]}" data-in="join.budget" aria-label="最低预算">
      <input type="range" id="bmax" min="${L}" max="${H}" step="100" value="${d.budget[1]}" data-in="join.budget" aria-label="最高预算">
    </div>
    <div class="row between small muted"><span>¥${L}</span><span>¥${H}</span></div></div>
  <div class="lock">🔒 预算只用于匹配，其他同学看不到你的具体数字，组队结果里只显示整团的区间。</div>`;
}

function step4(trip, d) {
  return `
  <div class="row between"><span class="label">按想去的顺序点选，最多 3 个</span>
    <button class="chip ${d.anyDestination ? 'on' : ''}" data-act="join.any">🎲 去哪都行</button></div>
  <div class="chips">${trip.destinations.map(x => {
    const i = d.destinations.indexOf(x);
    const full = d.destinations.length >= 3 && i < 0;
    return `<button class="chip ${i >= 0 ? 'on' : ''} ${d.anyDestination || full ? 'off' : ''}" data-act="join.dest" data-d="${esc(x)}">${i >= 0 ? `<span class="rank">${i + 1}</span>` : destEmoji(x)} ${esc(x)}</button>`;
  }).join('')}</div>
  <p class="small muted">${d.anyDestination ? '已开启「去哪都行」，系统会把你放进最合拍的团。' : d.destinations.length ? `你的志愿：${d.destinations.map((x, i) => `${'①②③'[i]} ${x}`).join('　')}` : '第一个点的就是第一志愿。'}</p>`;
}

function step5(trip, d) {
  const others = Q.members(trip.code).filter(m => m.id !== ui.join.memberId);
  return `
  <div class="field"><span class="label">旅行风格 <span class="muted small">（最多 5 个）</span></span>
    <div class="chips">${STYLE_TAGS.map(t => `<button class="chip ${d.styles.includes(t) ? 'on' : ''}" data-act="join.style" data-t="${t}">${t}</button>`).join('')}</div></div>
  <div class="field"><span class="label">旅行节奏</span>
    <div class="pace-cards">${Object.keys(PACE_LABEL).map(p => `<button class="pace-card ${d.pace === p ? 'on' : ''}" data-act="join.pace" data-p="${p}"><span class="e">${PACE_EMOJI[p]}</span><b>${PACE_LABEL[p]}</b><span class="small muted">${PACE_DESC[p]}</span></button>`).join('')}</div></div>
  <div class="field"><span class="label">住宿偏好</span>
    <div class="chips">${Object.keys(STAY_LABEL).map(s => `<button class="chip ${d.stay === s ? 'on' : ''}" data-act="join.stay" data-s="${s}">${STAY_LABEL[s]}</button>`).join('')}</div></div>
  <div class="field"><span class="label">想和谁一起 <span class="muted small">（可选，最多 3 位）</span></span>
    ${others.length ? `<div class="chips">${others.map(m => `<button class="chip ${d.buddies.includes(m.id) ? 'on' : ''}" data-act="join.buddy" data-id="${m.id}">${esc(m.avatar)} ${esc(m.nickname)}</button>`).join('')}</div>`
      : '<p class="small muted">还没有其他同学加入，之后可以回来修改。</p>'}</div>
  <div class="field"><span class="label">不想要的安排 <span class="muted small">（可选）</span></span>
    <div class="chips">${DISLIKES.map(t => `<button class="chip ${d.dislikes.includes(t) ? 'on' : ''}" data-act="join.dislike" data-t="${t}">🙅 ${t}</button>`).join('')}</div></div>`;
}

function joinDone(trip) {
  const m = S.members[ui.join.memberId];
  const p = m.preference;
  const top = p.styles[0] || '旅行';
  const titles = { 美食: '🍜 美食党', 自然风光: '🌿 自然派', 城市漫步: '🚶 城市漫游家', 拍照打卡: '📸 出片达人', 历史人文: '🏛️ 人文控', 海边度假: '🌊 海边人', 刺激项目: '🎢 冒险家' };
  return `
  <div class="step-wrap">
    <div class="persona">
      ${ava(m, 'lg')}
      <div class="eyebrow">我的旅行画像</div>
      <h2>${esc(m.nickname)} · ${titles[top] || top}</h2>
      <div class="chips" style="justify-content:center">
        <span class="tag sun">${PACE_EMOJI[p.pace]} ${PACE_LABEL[p.pace]}节奏</span>
        <span class="tag sea">${p.anyDestination ? '去哪都行' : '想去 ' + p.destinations.join(' / ')}</span>
        <span class="tag mint">期望 ${p.tripDays} 天</span>
        ${p.styles.map(s => `<span class="tag">${s}</span>`).join('')}
      </div>
      <p class="small muted">已有 ${Q.filled(trip.code).length} 位同学完成填写。预算不会出现在画像里。</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-act="nav" data-to="/t/${trip.code}">去看板看看谁也在 →</button>
        <button class="btn" data-act="join.edit">修改偏好</button>
      </div>
    </div>
  </div>`;
}

/* ---------- 交互 ---------- */
const J = () => ui.join, D = () => ui.join.draft;
IN['join.nick'] = el => { D().nickname = el.value; updateStepNav(); };
function updateStepNav() {
  // 只更新底部按钮状态，避免输入时整页重绘丢失焦点
  const err = stepError(J().step, D());
  const btn = document.querySelector('[data-act="join.next"],[data-act="join.submit"]');
  if (btn) btn.disabled = !!err;
  const hint = document.querySelector('.foot-nav .hint');
  if (hint) hint.textContent = err; else if (err && btn) btn.insertAdjacentHTML('beforebegin', `<span class="hint warn">${err}</span>`);
}
A['join.avatar'] = x => { D().avatar = x.a; render(); };
A['join.prev'] = () => { J().step--; render(); scrollTo(0, 0); };
A['join.next'] = () => {
  const j = J(), d = D();
  if (stepError(j.step, d)) return;
  if (j.step === 1) {
    const dup = Q.members(j.code).find(m => m.nickname === d.nickname.trim() && m.id !== j.memberId);
    if (dup) { ui.modal = { type: 'dupName', member: dup.id }; render(); return; }
  }
  j.step++; render(); scrollTo(0, 0);
};
A['join.rangeMode'] = () => { J().rangeMode = !J().rangeMode; J().anchor = null; render(); };
A['join.clearDates'] = () => { D().availableDates = []; J().anchor = null; render(); };
A['join.day'] = x => {
  const j = J(), d = D(), s = x.d;
  const set = new Set(d.availableDates);
  if (!j.rangeMode) { set.has(s) ? set.delete(s) : set.add(s); }
  else if (!j.anchor) {
    if (set.has(s)) set.delete(s); else { set.add(s); j.anchor = s; }
  } else {
    const [a, b] = j.anchor < s ? [j.anchor, s] : [s, j.anchor];
    dateList(a, b).forEach(t => set.add(t));
    j.anchor = null;
  }
  d.availableDates = [...set].sort();
  render();
};
A['join.days'] = x => { D().tripDays = Number(x.n); render(); };
IN['join.budget'] = el => {
  const d = D();
  const lo = Number(document.getElementById('bmin').value), hi = Number(document.getElementById('bmax').value);
  if (el.id === 'bmin') d.budget = [Math.min(lo, hi - 100), hi]; else d.budget = [lo, Math.max(hi, lo + 100)];

  return `
  <section class="card">
    <div class="row between" style="align-items:flex-start">

      </div>
      <div class="row">
        <button class="btn" data-act="dash.copyCode">复制邀请码</button>
        <button class="btn" data-act="dash.share">分享邀请</button>
      </div>
    </div>
  </section>

  ${me && !me.preference ? `<div class="banner"><span style="font-size:22px">✍️</span><div class="grow"><b>你还没填写偏好</b><div class="small muted">填完才能参与组队，大概 2 分钟。</div></div><button class="btn primary" data-act="dash.fillMine">去填写</button></div>` : ''}
  ${match ? `<div class="banner mint"><span style="font-size:22px">🧩</span><div class="grow"><b>已组成 ${match.groups.length} 个团${Q.unmatched(code).length ? `，${Q.unmatched(code).length} 人待调剂` : ''}</b>${match.stale ? '<div class="small">有同学更新了偏好或新加入，可以重新匹配。</div>' : ''}</div>
    <button class="btn primary" data-act="nav" data-to="/t/${code}/match">查看组队结果</button><button class="btn" data-act="match.rerun">重新匹配</button></div>` : ''}

  ${members.length <= 1 ? emptyView('🚌', '大巴车空空的，等同学上车', '把邀请码发到班群，大家填完偏好后就能一键组队。没有同学时，可以先模拟几位体验一下。',
    `<button class="btn primary" data-act="dash.share">复制邀请文案</button><button class="btn" data-act="dash.mock">+ 模拟一位同学加入</button>`) : ''}

  <div class="grid-2">
    <div class="stack" style="gap:20px;align-content:start">
      <section class="card">
        <div class="row" style="gap:20px">
          <div class="progress-ring" style="--p:${pct}"><div><b>${filled.length}/${members.length}</b><span class="small muted">人已上车</span></div></div>
          <div class="stack" style="flex:1;min-width:200px;gap:10px">

            <p class="small muted">${unfilled.length ? `未填写：${unfilled.map(m => esc(m.nickname)).join('、')}` : '所有加入的同学都填完了。'}</p>

            </div>

      </section>
    </div>

function memberCard(m, trip, me) {
  const isMe = me && me.id === m.id;
  const st = m.preference ? `<span class="st" style="color:var(--mint)">● 已填写</span>` : `<span class="st muted">○ 未填写</span>`;
  return `<button class="mcard ${isMe ? 'me' : ''} ${m.preference ? '' : 'pending'}" data-act="drawer.open" data-id="${m.id}">
    ${ava(m)}<div style="min-width:0"><div class="nm">${esc(m.nickname)}${isMe ? ' <span class="tag sea">我</span>' : ''}${trip.creatorId === m.id ? ' 👑' : ''}</div>${st}</div></button>`;
}

function insights(trip, filled) {
  if (filled.length < 3) {
    return `<section class="card empty"><div class="art">📊</div><h3>偏好洞察</h3><p class="muted small">3 人填写后解锁：热门目的地、日期热力图和预算分布。现在 ${filled.length} 人。</p></section>`;
  }
  // 目的地热度
  const dest = trip.destinations.map(d => ({
    d, want: filled.filter(m => m.preference.anyDestination || m.preference.destinations.includes(d)).length,
    first: filled.filter(m => m.preference.destinations[0] === d).length,
  })).sort((a, b) => b.want - a.want || b.first - a.first);
  const maxW = Math.max(1, ...dest.map(x => x.want));
  // 日期热力
  const days = dateList(trip.dateRange[0], trip.dateRange[1]);
  const cnt = Object.fromEntries(days.map(s => [s, 0]));
  filled.forEach(m => m.preference.availableDates.forEach(s => { if (s in cnt) cnt[s]++; }));
  const maxC = Math.max(1, ...Object.values(cnt));
  const peak = days.reduce((b, s) => cnt[s] > cnt[b] ? s : b, days[0]);
  const lead = new Date(toDayNum(days[0]) * DAY_MS).getUTCDay();
  // 预算分布（按区间中点）
  const buckets = [['< ¥1.5k', 0, 1500], ['¥1.5–2.5k', 1500, 2500], ['¥2.5–3.5k', 2500, 3500], ['> ¥3.5k', 3500, 1e9]];
  const bc = buckets.map(([l, a, b]) => ({ l, n: filled.filter(m => { const mid = (m.preference.budget[0] + m.preference.budget[1]) / 2; return mid >= a && mid < b; }).length }));
  const maxB = Math.max(1, ...bc.map(x => x.n));
  return `
  <section class="card">
    <div class="card-title"><h3>🔥 目的地热度</h3><span class="small muted">想去人数（含第一志愿）</span></div>
    <div class="bars">${dest.slice(0, 6).map(x => `<div class="bar-row"><span>${destEmoji(x.d)} ${esc(x.d)}</span><div class="bar"><i style="width:${x.want / maxW * 100}%"></i></div><span class="num small">${x.want} 人</span></div>`).join('')}</div>
  </section>
  <section class="card">
    <div class="card-title"><h3>📅 日期热力图</h3><span class="small muted">${fmtMD(peak)} 可出行的人最多（${cnt[peak]} 人）</span></div>
    <div class="heat">${'日一二三四五六'.split('').map(w => `<span class="wd">${w}</span>`).join('')}${'<span></span>'.repeat(lead)}
      ${days.map(s => { const r = cnt[s] / maxC; return `<span class="d" title="${fmtMD(s)}：${cnt[s]} 人有空" style="background:color-mix(in srgb, var(--sun) ${Math.round(r * 85)}%, var(--surface-2));color:${r > .55 ? 'var(--sun-ink)' : 'var(--muted)'}">${Number(s.slice(8))}</span>`; }).join('')}</div>
    <div class="legend" style="margin-top:10px"><i style="background:var(--surface-2)"></i>少 <i style="background:color-mix(in srgb, var(--sun) 45%, var(--surface-2))"></i> <i style="background:var(--sun)"></i>多</div>
  </section>
  <section class="card">
    <div class="card-title"><h3>💰 预算分布</h3><span class="small muted">只统计人数，不显示个人</span></div>
    <div class="bars">${bc.map(x => `<div class="bar-row"><span class="num">${x.l}</span><div class="bar sea"><i style="width:${x.n / maxB * 100}%"></i></div><span class="num small">${x.n} 人</span></div>`).join('')}</div>
  </section>`;
}
