/* ============ pages/match.js · AI 智能组队结果 ============ */
const LOAD_STEPS = ['对齐大家的可出行日期', '比较预算区间', '寻找口味相投的搭子', '生成推荐理由'];
const PASS_TONES = ['', 'sea', 'mint'];

function pageMatch(code) {
  const trip = Q.trip(code);
  if (!trip) return emptyView('🧭', '这个团不存在', '', navBtn('/', '回首页', 'btn primary'));
  if (ui.matchAnim) {
    return `<section class="card loading"><div class="plane-anim">✈️</div><h2>AI 正在为 ${Q.filled(code).length} 位同学组队…</h2>
      <ul class="load-steps">${LOAD_STEPS.map((s, i) => `<li class="${i < ui.matchAnim.step ? 'done' : i === ui.matchAnim.step ? 'now' : ''}">${i < ui.matchAnim.step ? '✓' : i === ui.matchAnim.step ? '…' : '○'} ${s}</li>`).join('')}</ul></section>`;
  }
  const match = Q.match(code);
  if (!match) {
    const n = Q.filled(code).length;
    return emptyView('🧩', '还没开始组队', n >= MIN_TO_MATCH ? `已有 ${n} 人填写，可以开始了。` : `至少 ${MIN_TO_MATCH} 人填写后才能组队，现在 ${n} 人。`,
      `${navBtn(`/t/${code}`, '回看板', 'btn')}${n >= MIN_TO_MATCH ? '<button class="btn primary" data-act="match.start">✨ 开始 AI 组队</button>' : ''}`);
  }
  const byId = Q.byId(code), me = Q.me(code);
  const un = Q.unmatched(code);
  const groups = match.groups;
  const total = groups.reduce((s, g) => s + g.memberIds.length, 0) + un.length;
  const avg = groups.length ? Math.round(groups.reduce((s, g) => s + g.score, 0) / groups.length) : 0;
  const myGroup = me && Q.groupOf(code, me.id);
  const myUn = me && un.find(u => u.member.id === me.id);

  let mine = '';
  if (me && !me.preference) mine = `<div class="banner"><span style="font-size:22px">✍️</span><div class="grow"><b>你（${esc(me.nickname)}）还没填写偏好</b>，暂时没有参与组队。</div><button class="btn primary" data-act="dash.fillMine">去填写</button></div>`;
  else if (myGroup) {
    const confirmed = myGroup.confirmedIds.includes(me.id);
    mine = `<div class="banner sea"><span style="font-size:26px">${destEmoji(myGroup.destination)}</span><div class="grow"><div class="small muted">${esc(me.nickname)}，你被分到了</div><b style="font-size:17px">${esc(myGroup.name)}</b> <span class="tag mint">匹配度 ${myGroup.score}%</span></div>
      ${confirmed ? `<button class="btn sea" data-act="nav" data-to="/t/${code}/g/${myGroup.id}">已确认 ✓ 进入小团</button><button class="btn sm ghost" data-act="g.confirm" data-g="${myGroup.id}">撤回确认</button>`
        : `<button class="btn primary" data-act="g.confirm" data-g="${myGroup.id}">确认加入</button>`}
      <button class="btn" data-act="move.open" data-m="${me.id}" data-self="1">申请换团</button></div>`;
  } else if (myUn) mine = `<div class="banner"><span style="font-size:22px">🧭</span><div class="grow"><b>${esc(me.nickname)}，你暂时在待调剂区</b><div class="small muted">${esc(myUn.reason)}</div></div><button class="btn primary" data-act="move.open" data-m="${me.id}" data-self="1">选择一个团加入</button></div>`;

  return `
  <div class="row between">
    <div><div class="eyebrow">AI 组队结果 · ${esc(trip.name)}</div><h2>${total} 人 → ${groups.length} 个团</h2></div>
    <div class="row">${navBtn(`/t/${code}`, '← 返回看板', 'btn ghost')}<button class="btn" data-act="match.rerun">重新匹配</button></div>
  </div>
  <div class="row">
    <span class="tag sun">平均匹配度 ${avg}%</span>
    <span class="tag mint">已确认 ${groups.reduce((s, g) => s + g.confirmedIds.length, 0)} 人</span>
    ${un.length ? `<span class="tag danger">${un.length} 人待调剂</span>` : '<span class="tag mint">全员已分团</span>'}
    <span class="small muted">点击成员头像可以把 TA 移到其他团，匹配度会实时重算</span>
  </div>
  ${match.stale ? `<div class="banner"><span>🔄</span><div class="grow small">有同学更新了偏好或新加入，重新匹配可以得到最新结果。</div><button class="btn sm primary" data-act="match.rerun">重新匹配</button></div>` : ''}
  ${mine}
  ${groups.length ? `<div class="pass-grid">${groups.map((g, i) => passCard(g, i, byId, me, code)).join('')}</div>`
    : emptyView('😵', '大家的时间太分散了', bestWindowHint(trip), navBtn(`/t/${code}`, '回看板', 'btn primary'))}
  ${un.length ? `
  <section class="card">
    <div class="card-title"><h3>🧭 待调剂 · ${un.length} 人</h3><span class="small muted">没有自动分团的原因和推荐去处</span></div>
    <div class="stack">${un.map(u => {
      const sg = u.suggest && groups.find(g => g.id === u.suggest.groupId);
      return `<div class="option" style="cursor:default">${ava(u.member)}<div class="grow"><b>${esc(u.member.nickname)}</b><div class="small muted">${esc(u.reason)}</div>
        ${sg ? `<div class="small">推荐：${esc(sg.name)} · 加入后预计匹配度 <b>${u.suggest.score}%</b>${u.suggest.hardOk ? '' : ' <span class="tag danger">有冲突</span>'}</div>` : ''}</div>

function bestWindowHint(trip) {
  const filled = Q.filled(trip.code);
  const cnt = {};
  filled.forEach(m => m.preference.availableDates.forEach(s => { cnt[s] = (cnt[s] || 0) + 1; }));
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return best ? `建议：${fmtMD(best[0])} 前后可出行的人最多（${best[1]} 人），可以请大家调整一下日期。` : '';
}

function modalMove(mid, self) {

  <div class="stack">${opts.map(({ g, p, full }) => `

/* ---------- 交互 ---------- */
function runMatchAnimated(code) {
  ui.matchAnim = { step: 0 };
  go(`/t/${code}/match`);
  const tick = () => {
    if (!ui.matchAnim) return;
    ui.matchAnim.step++;
    if (ui.matchAnim.step >= LOAD_STEPS.length) {
      Store.runMatch(code);
      ui.matchAnim = null;
      ui.openDetail = {};
      render();
      const m = Q.match(code);
      toast(`组队完成：${m.groups.length} 个团，${Q.unmatched(code).length} 人待调剂`);
    } else { render(); setTimeout(tick, 550); }
  };
  render();
  setTimeout(tick, 550);
}
A['match.start'] = () => {
  const code = route.code;
  if (Q.filled(code).length < MIN_TO_MATCH) { toast(`至少 ${MIN_TO_MATCH} 人填写后才能组队`); return; }
  if (Q.match(code)) A['match.rerun']();
  else runMatchAnimated(code);
};
A['match.rerun'] = () => askConfirm({
  title: '重新匹配？', body: '会按最新的偏好重新分团，当前的分组、确认状态、已生成的行程和账单都会被清空。', ok: '重新匹配', danger: true,
  onOk: () => runMatchAnimated(route.code),
});
A['g.detail'] = x => { ui.openDetail[x.g] = !ui.openDetail[x.g]; render(); };
A['g.confirm'] = x => {
  const code = route.code, me = Q.me(code);
  const was = Q.group(code, x.g).confirmedIds.includes(me.id);
  const full = Store.toggleConfirm(code, x.g, me.id);
  render();
  if (full) { confetti(); toast(`${Q.group(code, x.g).name} 正式成团！`); }
  else toast(was ? '已撤回确认' : '已确认加入 ✓');
};
A['move.open'] = x => { ui.modal = { type: 'move', mid: x.m, self: !!x.self }; render(); };
A['move.to'] = x => {
  const m = S.members[x.m];
  const code = m.tripCode;
  Store.moveMember(code, x.m, x.g || null);
  ui.modal = null;
  render();
  toast(x.g ? `${m.nickname} 已换到 ${Q.group(code, x.g).name}，匹配度已重算` : `${m.nickname} 已移到待调剂区`);
};

function planTab(code, g, byId, me) {
  if (ui.planAnim) return `<section class="card loading"><div class="plane-anim">🧳</div><h3>正在打包行李，为 ${g.memberIds.length} 人安排 ${g.days} 天行程…</h3><p class="muted small">读取团画像 → 匹配目的地资源库 → 估算预算</p></section>`;
  const it = S.itineraries[g.id];
  const ms = g.memberIds.map(i => byId[i]).filter(m => m && m.preference);
  if (!it) {
    const prof = groupProfile(ms);
    const tags = Object.entries(prof.tagWeight).sort((a, b) => b[1] - a[1]).slice(0, 3);
    return `<section class="card empty">
      <div class="art">🧳</div><h3>行李箱已就绪</h3>
      <p class="muted">会根据团画像，从${esc(g.destination)}的资源库里挑选景点、美食和住宿：</p>
      <div class="chips" style="justify-content:center">${tags.map(([t, n]) => `<span class="tag sun">${t} ×${n}</span>`).join('')}
        <span class="tag lemon">${PACE_EMOJI[prof.pace]} ${PACE_LABEL[prof.pace]}节奏</span><span class="tag sea">${g.days} 天</span>
        <span class="tag mint">¥${g.budgetRange[0]}–${g.budgetRange[1]}</span>${prof.exclusions.length ? `<span class="tag danger">避开：${prof.exclusions.join('、')}</span>` : ''}</div>
      <button class="btn primary lg" data-act="plan.gen" ${g.days ? '' : 'disabled'}>✨ 生成我们的行程</button>
      ${g.days ? '' : '<span class="hint warn">团内没有共同空档，先调整成员或日期。</span>'}
    </section>`;
  }
  const lib = getPoiLib(g.destination);
  const di = Math.min(ui.day[g.id] || 0, it.days.length - 1);
  const day = it.days[di];
  const stale = it.memberSig !== g.memberIds.slice().sort().join(',');
  return `
  ${stale ? `<div class="banner"><span>🔄</span><div class="grow small">团里成员有变动，可以重新生成行程来照顾新同学的偏好。</div><button class="btn sm primary" data-act="plan.regen">重新生成</button></div>` : ''}
  <div class="plan-layout">
    <div class="stack" style="gap:16px">
      <div class="days">${it.days.map((d, i) => `<button class="day-btn ${i === di ? 'on' : ''}" data-act="plan.day" data-i="${i}"><b>DAY ${i + 1}</b><small>${fmtMD(d.date)} 周${weekdayCN(d.date)}</small></button>`).join('')}</div>
      <div class="timeline">${day.items.map(item => `
        <div class="tl-row"><div class="tl-slot"><div class="ic">${SLOT_ICON[item.slot]}</div>${SLOT_LABEL[item.slot]}</div>${itemCard(it, di, item, lib, me)}</div>`).join('')}</div>
      <div class="row">
        <button class="btn" data-act="plan.copy">📋 复制文字版行程</button>
        <button class="btn" data-act="plan.regen">🔄 重新生成</button>
        <button class="btn primary" data-act="nav" data-to="/t/${code}/g/${g.id}/split">去记账 →</button>
      </div>
    </div>
    ${budgetPanel(it, g, lib)}
  </div>`;
}

function itemCard(it, di, item, lib, me) {
  if (item.fixed) return `<div class="ticket fixed"><div class="ticket-head"><span class="em">${item.fixed.emoji}</span><div class="t"><b>${esc(item.fixed.title)}</b><div class="why">${esc(item.fixed.note)}</div></div></div></div>`;

    <div class="ticket-actions"><button class="btn sm primary" data-act="plan.addOpen" data-d="${di}" data-i="${item.id}">+ 添加</button></div></div>`;

    <div class="ticket-head"><span class="em">${p.emoji}</span>
      <div class="t"><b>${esc(p.name)}</b><div class="chips" style="gap:4px;margin-top:4px">${p.type === 'f' && p.tags.includes('美食') ? '' : `<span class="tag sea">${TYPE_LABEL[p.type]}</span>`}${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div>

function splitTab(code, g, byId, me) {
  const ex = Q.expenses(g.id);
  const total = ex.reduce((s, e) => s + e.amount, 0);
  const n = g.memberIds.length;
  const it = S.itineraries[g.id];
  const estAll = it ? it.estimate.total * n * 100 : 0;
  const tab = ui.splitTab;
  const fab = `<div class="fab"><button class="btn primary lg" data-act="exp.new">+ 记一笔</button></div>`;
  const summary = `
  <div class="stat-row">
    <div class="stat"><small>总支出</small><b>${fmtFen(total)}</b><small>${ex.length} 笔账单</small></div>
    <div class="stat"><small>人均</small><b>${fmtFen(Math.round(total / Math.max(1, n)))}</b><small>${n} 人</small></div>
    <div class="stat"><small>与行程预估对比</small><b style="font-size:16px">${!it ? '还没生成行程' : !total ? `预估 ${fmtFen(estAll)}` : total <= estAll ? `比预估少 ${fmtFen(estAll - total)} 👍` : `超出预估 ${fmtFen(total - estAll)}`}</b><small>${it ? `全团预估 ${fmtFen(estAll)}` : '生成行程后可对比'}</small></div>
  </div>`;
  const tabs = `<div class="row"><div class="seg"><button class="${tab === 'bills' ? 'on' : ''}" data-act="split.tab" data-t="bills">账单</button><button class="${tab === 'settle' ? 'on' : ''}" data-act="split.tab" data-t="settle">结算</button></div><span class="spacer"></span>
    ${ex.length ? '' : '<button class="btn sm" data-act="exp.demo">导入示例账单</button>'}</div>`;
  if (tab === 'bills') {
    if (!ex.length) return summary + tabs + emptyView('🏨', '还没有账单', '第一笔通常是住宿。记账时可以只勾选实际参与的人，比如没去 KTV 的同学不用分摊。',
      `<button class="btn primary" data-act="exp.new">+ 记一笔</button><button class="btn" data-act="exp.demo">导入示例账单</button>`) + fab;
    const byDate = {};
    ex.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
    return summary + tabs + Object.entries(byDate).map(([d, list]) => `
      <section class="stack" style="gap:8px"><div class="small muted">${fmtMD(d)} 周${weekdayCN(d)} · ${fmtFen(list.reduce((s, e) => s + e.amount, 0))}</div>
      ${list.map(e => {
        const payer = byId[e.payerId];
        const all = e.participantIds.length === n && g.memberIds.every(i => e.participantIds.includes(i));
        return `<button class="bill" data-act="exp.edit" data-id="${e.id}"><span class="cat">${CAT_EMOJI[e.category] || '🧾'}</span>
          <div class="info"><b>${esc(e.title)}</b><span class="small muted">${payer ? `${esc(payer.avatar)} ${esc(payer.nickname)} 付款` : ''} · ${all ? '全员' : `${e.participantIds.length} 人`}参与 · 人均 ${fmtFen(Math.round(e.amount / e.participantIds.length))}</span></div>
          <span class="amt">${fmtFen(e.amount)}</span></button>`;
      }).join('')}</section>`).join('') + fab;
  }
  // 结算
  const bal = computeBalances(ex, g.memberIds);
  const tr = settle(bal);
  const paid = S.paid[g.id] || [];
  const doneN = tr.filter(t => paid.includes(transferKey(t))).length;
  const allDone = tr.length && doneN === tr.length;
  const name = id => byId[id] ? `${byId[id].avatar} ${esc(byId[id].nickname)}` : '已退出成员';
  if (!ex.length) return summary + tabs + emptyView('🧮', '还没有可结算的账单', '记账后会自动生成最省事的转账方案。', `<button class="btn primary" data-act="exp.new">+ 记一笔</button><button class="btn" data-act="exp.demo">导入示例账单</button>`) + fab;
  return summary + tabs + `
  ${allDone ? `<div class="banner mint"><span style="font-size:26px">🎉</span><div class="grow"><b>账清了，友谊还在</b><div class="small">${tr.length} 笔转账全部完成。</div></div></div>` : ''}
  <div class="grid-2">
    <section class="card stack">
      <div class="card-title"><h3>转账方案</h3><span class="tag ${allDone ? 'mint' : 'sun'}">已结清 ${doneN}/${tr.length}</span></div>
      ${tr.length ? tr.map(t => { const k = transferKey(t), done = paid.includes(k);
        return `<div class="transfer ${done ? 'done' : ''}"><span>${name(t.from)}</span><span class="arrow">→</span><span>${name(t.to)}</span><span class="amt">${fmtFen(t.amount)}</span>
          <button class="btn sm ${done ? '' : 'primary'}" data-act="split.paid" data-k="${esc(k)}">${done ? '撤销' : '标记已转'}</button></div>`; }).join('')
        : '<div class="empty"><div class="art">✨</div><b>大家互不相欠</b><p class="small muted">每个人付的正好等于该承担的。</p></div>'}
      <p class="small muted">按「最大欠款人转给最大应收人」计算，转账笔数不超过 ${Math.max(0, n - 1)} 笔。</p>
      ${tr.length ? '<button class="btn" data-act="split.copy">📋 复制结算清单</button>' : ''}
    </section>
    <section class="card">
      <div class="card-title"><h3>每人收支</h3></div>
      <div class="table-wrap"><table class="bal-table"><thead><tr><th>成员</th><th>已垫付</th><th>应承担</th><th>差额</th></tr></thead><tbody>
      ${Object.entries(bal).map(([id, b]) => `<tr><td>${name(id)}</td><td>${fmtFen(b.paid)}</td><td>${fmtFen(b.owed)}</td><td class="${b.net > 0 ? 'pos' : b.net < 0 ? 'neg' : ''}">${b.net > 0 ? '+' : ''}${fmtFen(b.net)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin-top:8px">差额为正表示应收，为负表示应付。</p>
    </section>
  </div>` + fab;
}

/* ============ app.js · 路由、布局、弹层、事件委托、启动 ============ */
let route = { name: 'landing' };

function parseRoute(h) {
  const p = (h || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!p.length) return { name: 'landing' };
  if (p[0] === 'create') return { name: 'create' };
  if (p[0] === 't' && p[1]) {
    const code = p[1].toUpperCase();
    if (!p[2]) return { name: 'dash', code };
    if (p[2] === 'join') return { name: 'join', code };
    if (p[2] === 'match') return { name: 'match', code };
    if (p[2] === 'g' && p[3]) return { name: 'group', code, gid: p[3], tab: p[4] === 'split' ? 'split' : 'plan' };
  }
  return { name: 'landing' };
}
function routeToPath(r) {
  return r.name === 'landing' ? '/' : r.name === 'create' ? '/create' : r.name === 'dash' ? `/t/${r.code}`
    : r.name === 'group' ? `/t/${r.code}/g/${r.gid}${r.tab === 'split' ? '/split' : ''}` : `/t/${r.code}/${r.name}`;
}

/** 路由跳转：优先写入 hash（支持浏览器后退），在受限环境中退回内存路由 */
function go(path) {
  ui.modal = null;
  const prev = route;
  route = parseRoute('#' + path);
  onEnter(prev);
  try { if (location.hash !== '#' + path) history.pushState(null, '', '#' + path); } catch (e) { /* sandbox */ }
  try { sessionStorage.setItem('gradtrip.route', path); } catch (e) { /* ignore */ }
  render();
  window.scrollTo(0, 0);
}
function onEnter(prev) {
  if (route.code && S.trips[route.code]) S.lastTrip = route.code, persist();
  if (route.name === 'join' && (!prev || prev.name !== 'join')) ui.join = null;
  if (route.name === 'create' && (!prev || prev.name !== 'create')) ui.create = null;
  if (route.name === 'group' && (!prev || prev.gid !== route.gid)) ui.splitTab = 'bills';
  if (route.name !== 'match') ui.matchAnim = null;
}

function pageFor(r) {
  switch (r.name) {
    case 'create': return pageCreate();
    case 'dash': return pageDash(r.code);
    case 'join': return pageJoin(r.code);
    case 'match': return pageMatch(r.code);
    case 'group': return pageGroup(r.code, r.gid, r.tab);
    default: return pageLanding();
  }
}

}

function render() {
  const app = document.getElementById('app');
  let page;
  try { page = pageFor(route); }
  catch (e) { console.error(e); page = emptyView('🛠️', '页面出了点问题', esc(e.message), navBtn('/', '回首页', 'btn primary') + '<button class="btn" data-act="demo.reset">重置 Demo</button>'); }
  app.innerHTML = `${topbar()}<main class="wrap page" id="main">${page}</main>${dock()}${overlay()}`;
  if (ui.modal && ui.modal.type === 'copy') { const t = document.getElementById('copy-area'); if (t) { t.focus(); t.select(); } }
}

/* ---------- 全局动作 ---------- */
A.nav = x => go(x.to);
A['modal.close'] = () => closeModal();
A['modal.backdrop'] = (x, el, e) => { if (e.target === el) closeModal(); };
A['confirm.ok'] = () => { const fn = ui.modal.onOk; ui.modal = null; fn && fn(); if (!ui.modal) render(); };
A['dock.toggle'] = () => { ui.dock = !ui.dock; render(); };
A['demo.reset'] = () => askConfirm({
  title: '重置 Demo？', body: '会清空这个浏览器里所有活动、偏好、行程和账单，回到首页。', ok: '清空并重置', danger: true,
  onOk: () => { Store.resetAll(); Object.assign(ui, { dock: false, join: null, create: null, codeOpen: false, codeVal: '', openDetail: {}, day: {} }); go('/'); toast('已重置，可以重新开始演示'); },
});
A['created.copyCode'] = x => copyText(x.c, `邀请码 ${x.c} 已复制`);
A['created.copyText'] = x => copyText(inviteText(S.trips[x.c]), '邀请文案已复制');
A['created.fill'] = x => { ui.joinIntent = null; ui.join = null; go(`/t/${x.c}/join`); };
CH.who = el => {
  if (!el.value) return;
  Store.setCurrent(route.code, el.value);
  const m = S.members[el.value];
  if (route.name === 'join') ui.join = null;
  render();
  toast(`已切换为 ${m.nickname}`);
};

/* ---------- 事件委托 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (!fn) { console.warn('未注册的动作', el.dataset.act); return; }
  e.preventDefault();
  fn({ ...el.dataset }, el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) { closeModal(); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
    e.preventDefault();
    const fn = A[e.target.dataset.enter]; fn && fn({ ...e.target.dataset }, e.target, e);
  }
});
window.addEventListener('popstate', () => { const prev = route; route = parseRoute(location.hash); ui.modal = null; onEnter(prev); render(); });
window.addEventListener('hashchange', () => { const r = parseRoute(location.hash); if (routeToPath(r) !== routeToPath(route)) { const prev = route; route = r; ui.modal = null; onEnter(prev); render(); } });

/* ---------- 启动 ---------- */
(function boot() {
  let start = location.hash && location.hash.length > 2 ? location.hash : '';
  if (!start) { try { const s = sessionStorage.getItem('gradtrip.route'); if (s) start = '#' + s; } catch (e) { /* ignore */ } }
  route = parseRoute(start);
  onEnter(null);
  render();
})();

</script>
</body>
</html>
